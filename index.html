<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة فحص جودة الشبكة | مشروع تخرج</title>
    <script src="https://bernii.github.io/gauge.js/dist/gauge.min.js"></script>
    <style>
        :root { --bg: #0f172a; --surface: #1e293b; --primary: #3b82f6; --ping: #f59e0b; --text: #f8fafc; --text-dim: #94a3b8; --border: #334155; }
        * { box-sizing: border-box; }
        body { font-family: 'Segoe UI', system-ui, sans-serif; background-color: var(--bg); color: var(--text); display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 20px; }
        
        .app-container { background-color: var(--surface); padding: 40px; border-radius: 20px; border: 1px solid var(--border); box-shadow: 0 20px 40px rgba(0,0,0,0.4); width: 100%; max-width: 600px; text-align: center; }
        
        .gauge-section { position: relative; width: 100%; max-width: 360px; height: 180px; margin: 0 auto 40px auto; }
        #speedGauge { width: 100%; height: 100%; }
        .speed-readout { position: absolute; bottom: -10px; left: 0; width: 100%; text-align: center; }
        .speed-value { font-size: 58px; font-weight: 800; color: var(--primary); line-height: 1; text-shadow: 0 0 15px rgba(59, 130, 246, 0.3); }
        .speed-unit { font-size: 15px; color: var(--text-dim); font-weight: 600; text-transform: uppercase; letter-spacing: 1px; }

        .results-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 30px; }
        .result-card { background: rgba(15, 23, 42, 0.5); border: 1px solid var(--border); padding: 20px; border-radius: 12px; display: flex; flex-direction: column; justify-content: center; align-items: center; }
        
        .card-title { font-size: 13px; color: var(--text-dim); margin-bottom: 8px; font-weight: 600; text-transform: uppercase; }
        .card-value { font-size: 26px; font-weight: 700; color: var(--text); display: flex; align-items: baseline; gap: 4px; }
        .card-value span { font-size: 13px; color: #64748b; font-weight: 500; }
        .color-ping { color: var(--ping); }

        .action-btn { background: var(--primary); color: white; border: none; padding: 16px; border-radius: 10px; font-size: 18px; font-weight: bold; cursor: pointer; transition: 0.3s; width: 100%; }
        .action-btn:hover { background: #2563eb; transform: translateY(-2px); }
        .action-btn:disabled { background: var(--border); color: var(--text-dim); cursor: not-allowed; transform: none; }
        
        .status-bar { margin-top: 20px; font-size: 14px; color: #10b981; font-weight: 600; height: 20px; }
    </style>
</head>
<body>

    <div class="app-container">
        <div class="gauge-section">
            <canvas id="speedGauge"></canvas>
            <div class="speed-readout">
                <div class="speed-value" id="mainValue">0.00</div>
                <div class="speed-unit">Mbps</div>
            </div>
        </div>

        <div class="results-grid">
            <div class="result-card">
                <div class="card-title">البنق الأساسي</div>
                <div class="card-value color-ping" id="idlePing">-- <span>ms</span></div>
            </div>
            <div class="result-card">
                <div class="card-title">التحميل (Download)</div>
                <div class="card-value" id="dlSpeed">-- <span>Mbps</span></div>
            </div>
            <div class="result-card">
                <div class="card-title">البنق المثقل</div>
                <div class="card-value color-ping" id="loadedPing">-- <span>ms</span></div>
            </div>
            <div class="result-card">
                <div class="card-title">الرفع (Upload)</div>
                <div class="card-value" id="ulSpeed">-- <span>Mbps</span></div>
            </div>
        </div>

        <button class="action-btn" id="startBtn">بدء الاختبار المرجعي</button>
        <div class="status-bar" id="statusText">النظام جاهز للاختبار</div>
    </div>

    <script src="script.js"></script>
</body>
</html>
