<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>فحص الشبكة المتقدم</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background-color: #121212; color: #e0e0e0; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .container { background-color: #1e1e1e; padding: 30px; border-radius: 8px; border: 1px solid #333; width: 500px; }
        h2 { margin: 0 0 20px 0; font-size: 20px; font-weight: normal; color: #fff; border-bottom: 1px solid #333; padding-bottom: 10px; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 20px; }
        .box { background-color: #252525; padding: 15px; border-radius: 6px; border: 1px solid #333; display: flex; flex-direction: column; }
        .box.full { grid-column: span 2; flex-direction: row; justify-content: space-between; align-items: center; }
        .label { font-size: 13px; color: #888; margin-bottom: 8px; }
        .value { font-size: 24px; font-weight: bold; color: #fff; }
        .value span.unit { font-size: 14px; color: #666; font-weight: normal; margin-right: 4px; }
        button { background-color: #007bff; color: white; border: none; padding: 12px; width: 100%; border-radius: 4px; font-size: 15px; cursor: pointer; transition: 0.2s; }
        button:hover { background-color: #0056b3; }
        button:disabled { background-color: #444; color: #888; cursor: not-allowed; }
        #status { margin-top: 15px; font-size: 13px; color: #aaa; text-align: center; height: 16px; }
    </style>
</head>
<body>

    <div class="container">
        <h2>إحصائيات الاتصال</h2>
        
        <div class="grid">
            <div class="box full">
                <span class="label">المزود الأفضل للاستجابة</span>
                <span class="value" id="bestServer">--</span>
            </div>
            
            <div class="box">
                <span class="label">الاستجابة (Ping)</span>
                <div class="value"><span id="pingIdle">--</span><span class="unit">ms</span></div>
            </div>
            <div class="box">
                <span class="label">التحميل (Download)</span>
                <div class="value"><span id="downloadSpeed">--</span><span class="unit">Mbps</span></div>
            </div>
            
            <div class="box">
                <span class="label">الاستجابة المثقلة (تحميل)</span>
                <div class="value"><span id="pingLoadedDown">--</span><span class="unit">ms</span></div>
            </div>
            <div class="box">
                <span class="label">الرفع (Upload)</span>
                <div class="value"><span id="uploadSpeed">--</span><span class="unit">Mbps</span></div>
            </div>
            
            <div class="box">
                <span class="label">الاستجابة المثقلة (رفع)</span>
                <div class="value"><span id="pingLoadedUp">--</span><span class="unit">ms</span></div>
            </div>
        </div>

        <button id="startBtn">بدء الفحص</button>
        <div id="status"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
