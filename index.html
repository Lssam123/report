<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>مشروع التخرج | أداة قياس جودة الاتصال</title>

    <style>
        :root {
            --bg-body: #f0f2f5;
            --bg-surface: #ffffff;
            --text-dark: #202124;
            --text-gray: #5f6368;
            --border-color: #dadce0;
            --primary: #00643c; 
        }

        body {
            font-family: 'Segoe UI', Tahoma, sans-serif;
            background-color: var(--bg-body);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        /* 1. الشريط العلوي */
        .top-bar {
            width: 100%;
            max-width: 900px; /* تحديد عرض ثابت متناسق */
            background: white;
            border-bottom: 2px solid var(--primary);
            padding: 15px 25px;
            display: flex;
            align-items: center;
            justify-content: flex-start;
            box-sizing: border-box;
            gap: 20px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            z-index: 10;
        }

        .top-bar img {
            height: 60px;
            width: auto;
        }

        .top-bar-text {
            font-size: 18px;
            font-weight: 700;
            color: var(--text-dark);
            border-right: 3px solid var(--primary);
            padding-right: 15px;
            line-height: 1.4;
        }

        /* 2. مربع الاختبار - ملتصق تماماً ويفس العرض */
        .dashboard-container {
            width: 100%;
            max-width: 900px; /* نفس عرض الشريط العلوي */
            background: var(--bg-surface);
            border: 1px solid var(--border-color);
            border-top: none; /* إزالة الحدود العلوية للالتصاق */
            padding: 40px 20px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.05);
            box-sizing: border-box;
        }

        .header-titles h1 {
            font-size: 24px;
            text-align: center;
            margin-bottom: 30px;
            color: var(--text-dark);
        }

        .live-monitor {
            text-align: center;
            padding: 40px 0;
            margin-bottom: 30px;
            border-radius: 12px;
            background-color: #fcfcfc;
            border: 1px solid #eee;
        }

        .live-val {
            font-size: clamp(60px, 15vw, 100px);
            font-weight: 300;
            line-height: 1;
            color: var(--text-dark);
        }

        .live-unit {
            font-size: 20px;
            font-weight: 600;
            color: var(--text-gray);
            margin-top: 5px;
        }

        .cards-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin-bottom: 40px;
        }

        @media (min-width: 600px) {
            .cards-grid {
                grid-template-columns: repeat(4, 1fr);
            }
        }

        .data-card {
            background: var(--bg-surface);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 25px 5px;
            text-align: center;
        }

        .card-label {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-gray);
            margin-bottom: 12px;
        }

        .card-val {
            font-size: 30px;
            font-weight: 800;
            direction: ltr;
        }

        .card-val span {
            font-size: 13px;
            color: var(--text-gray);
        }

        .btn-start {
            background-color: var(--primary);
            color: #ffffff;
            border: none;
            padding: 18px 50px;
            border-radius: 10px;
            font-size: 20px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            max-width: 350px;
            display: block;
            margin: 0 auto;
        }

        @media (max-width: 900px) {
            .top-bar, .dashboard-container {
                max-width: 95%; /* في الجوال نترك مساحة بسيطة جداً */
            }
        }

        @media (max-width: 500px) {
            .top-bar-text { font-size: 15px; }
            .top-bar img { height: 50px; }
        }
    </style>
</head>
<body>

    <div class="top-bar">
        <img src="logo.png" alt="Logo">
        <div class="top-bar-text">
            مشروع تخرج متدربي الكلية التقنية <span style="color:var(--primary)">2026م</span>
        </div>
    </div>

    <div class="dashboard-container">
        <div class="header-titles">
            <h1>اختبار سرعة الإنترنت</h1>
        </div>

        <div class="live-monitor">
            <div class="live-val" id="mainValue">0</div>
            <div class="live-unit" id="mainUnit">Mbps</div>
        </div>

        <div class="cards-grid">
            <div class="data-card" id="boxUnloaded">
                <div class="card-label">البنق العادي</div>
                <div class="card-val"><span id="valUnloaded">--</span><span>ms</span></div>
            </div>
            
            <div class="data-card" id="boxDownload">
                <div class="card-label">التنزيل</div>
                <div class="card-val"><span id="valDownload">--</span><span>Mbps</span></div>
            </div>

            <div class="data-card" id="boxLoaded">
                <div class="card-label">البنق المثقل</div>
                <div class="card-val"><span id="valLoaded">--</span><span>ms</span></div>
            </div>

            <div class="data-card" id="boxUpload">
                <div class="card-label">الرفع</div>
                <div class="card-val"><span id="valUpload">--</span><span>Mbps</span></div>
            </div>
        </div>

        <button class="btn-start" id="startBtn">بدء الاختبار</button>
        <div style="text-align:center; margin-top:15px; color:var(--text-gray);" id="statusText">جاهز للفحص</div>
    </div>

    <script src="script.js"></script>
</body>
</html>
