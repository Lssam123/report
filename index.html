<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>أداة قياس جودة الاتصال</title>
    <style>
        /* --- تصميم Corporate Minimalist (أسلوب جوجل/كلاودفلير) --- */
        :root {
            --bg-color: #f8f9fa;
            --surface: #ffffff;
            --text-dark: #202124;
            --text-gray: #5f6368;
            --border: #dadce0;
            --primary: #1a73e8; /* أزرق جوجل القياسي */
            --success: #1e8e3e;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-dark);
            margin: 0;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 750px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 40px;
            box-shadow: 0 1px 3px rgba(60,64,67,0.1);
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
        }

        .header h1 {
            font-size: 24px;
            font-weight: 400;
            margin: 0 0 10px 0;
            color: var(--text-dark);
        }

        .header p {
            margin: 0;
            color: var(--text-gray);
            font-size: 14px;
        }

        /* --- شريط القياس اللحظي --- */
        .live-monitor {
            text-align: center;
            margin-bottom: 40px;
            padding-bottom: 40px;
            border-bottom: 1px solid var(--border);
        }

        .live-value {
            font-size: 72px;
            font-weight: 300;
            letter-spacing: -2px;
            line-height: 1;
            color: var(--text-dark);
            transition: color 0.3s;
        }

        .live-unit {
            font-size: 16px;
            color: var(--text-gray);
            text-transform: uppercase;
        }

        /* --- شبكة البيانات الـ 4 --- */
        .metrics-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            margin-bottom: 40px;
        }

        .metric-item {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            padding: 15px;
            background: #f8f9fa;
            border-radius: 8px;
            border: 1px solid transparent;
        }

        .metric-item.active {
            border-color: var(--primary);
            background: #e8f0fe;
        }

        .m-label {
            font-size: 13px;
            color: var(--text-gray);
            margin-bottom: 8px;
            font-weight: 500;
        }

        .m-value {
            font-size: 24px;
            font-weight: 600;
            color: var(--text-dark);
            display: flex;
            align-items: baseline;
            gap: 4px;
        }

        .m-value span {
            font-size: 12px;
            font-weight: 400;
            color: var(--text-gray);
        }

        /* --- أزرار التحكم --- */
        .controls {
            display: flex;
            justify-content: center;
            flex-direction: column;
            align-items: center;
        }

        .btn-primary {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 12px 32px;
            border-radius: 6px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.2s;
            min-width: 200px;
        }

        .btn-primary:hover { background-color: #1557b0; }
        .btn-primary:disabled { background-color: var(--border); color: var(--text-gray); cursor: not-allowed; }

        .status-msg {
            margin-top: 15px;
            font-size: 13px;
            color: var(--text-gray);
        }

        @media (max-width: 600px) {
            .metrics-grid { grid-template-columns: repeat(2, 1fr); }
            .metric-item { align-items: center; }
        }
    </style>
</head>
<body>

    <div class="container">
        
        <div class="header">
            <h1>تشخيص جودة الشبكة</h1>
            <p>يتم الفحص عبر خوادم شبكة تسليم المحتوى (CDN)</p>
        </div>

        <div class="live-monitor">
            <div class="live-value" id="mainValue">0.00</div>
            <div class="live-unit" id="mainUnit">Mbps</div>
        </div>

        <div class="metrics-grid">
            <div class="metric-item" id="boxUnloaded">
                <div class="m-label">البنق غير المثقل</div>
                <div class="m-value" id="valUnloaded">-- <span>ms</span></div>
            </div>
            
            <div class="metric-item" id="boxDownload">
                <div class="m-label">سرعة التنزيل</div>
                <div class="m-value" id="valDownload">-- <span>Mbps</span></div>
            </div>

            <div class="metric-item" id="boxLoaded">
                <div class="m-label">البنق المثقل</div>
                <div class="m-value" id="valLoaded">-- <span>ms</span></div>
            </div>

            <div class="metric-item" id="boxUpload">
                <div class="m-label">سرعة الرفع</div>
                <div class="m-value" id="valUpload">-- <span>Mbps</span></div>
            </div>
        </div>

        <div class="controls">
            <button class="btn-primary" id="startBtn">بدء الفحص</button>
            <div class="status-msg" id="statusText">الأنظمة جاهزة للبدء</div>
        </div>

    </div>

    <script src="script.js"></script>
</body>
</html>
