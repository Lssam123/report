<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة قياس جودة الشبكات | مشروع تخرج</title>
    <style>
        /* --- تصميم النيومورفيزم (Neumorphism) الحديث والمجسم --- */
        :root {
            --bg-color: #e0e5ec;
            --text-main: #2d3436;
            --text-muted: #636e72;
            --accent-blue: #0984e3;
            --accent-green: #00b894;
            --accent-orange: #e17055;
            
            /* الظلال المجسمة الأساسية */
            --shadow-out: 9px 9px 16px rgba(163, 177, 198, 0.6), -9px -9px 16px rgba(255, 255, 255, 0.5);
            --shadow-in: inset 6px 6px 10px rgba(163, 177, 198, 0.6), inset -6px -6px 10px rgba(255, 255, 255, 0.5);
        }

        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .dashboard {
            background-color: var(--bg-color);
            border-radius: 30px;
            box-shadow: var(--shadow-out);
            width: 100%;
            max-width: 600px;
            padding: 40px;
            text-align: center;
        }

        /* --- العداد النصف دائري (SVG Speedometer) --- */
        .gauge-wrapper {
            position: relative;
            width: 300px;
            height: 160px;
            margin: 0 auto 30px auto;
        }

        .gauge-svg {
            width: 100%;
            height: 100%;
            overflow: visible;
        }

        .gauge-track {
            fill: none;
            stroke: #d1d9e6;
            stroke-width: 18;
            stroke-linecap: round;
        }

        .gauge-fill {
            fill: none;
            stroke: var(--accent-blue);
            stroke-width: 18;
            stroke-linecap: round;
            stroke-dasharray: 283; /* محيط نصف الدائرة */
            stroke-dashoffset: 283; /* يبدأ فارغاً */
            transition: stroke-dashoffset 0.2s ease, stroke 0.3s ease;
        }

        .gauge-center {
            position: absolute;
            bottom: -10px;
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
        }

        .gauge-value {
            font-size: 56px;
            font-weight: 900;
            color: var(--text-main);
            line-height: 1;
        }

        .gauge-unit {
            font-size: 16px;
            color: var(--text-muted);
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* --- شبكة النتائج المجسمة --- */
        .metrics-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 25px;
            margin-bottom: 35px;
        }

        .metric-card {
            background-color: var(--bg-color);
            border-radius: 20px;
            box-shadow: var(--shadow-out);
            padding: 20px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .metric-label {
            font-size: 13px;
            color: var(--text-muted);
            font-weight: 700;
            margin-bottom: 8px;
        }

        .metric-val {
            font-size: 26px;
            font-weight: 800;
            color: var(--text-main);
        }

        .metric-val span {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-muted);
            margin-right: 4px;
        }

        /* ألوان القيم لتمييز النتائج */
        .color-ping { color: var(--accent-orange); }
        .color-dl { color: var(--accent-blue); }
        .color-ul { color: var(--accent-green); }

        /* --- الزر المجسم --- */
        button {
            background-color: var(--bg-color);
            color: var(--accent-blue);
            border: none;
            padding: 18px 40px;
            border-radius: 20px;
            font-size: 18px;
            font-weight: 800;
            cursor: pointer;
            box-shadow: var(--shadow-out);
            transition: all 0.2s ease;
            width: 100%;
            outline: none;
        }

        button:active {
            box-shadow: var(--shadow-in);
            color: var(--text-main);
        }

        button:disabled {
            color: var(--text-muted);
            cursor: not-allowed;
            box-shadow: var(--shadow-in);
        }

        #statusText {
            margin-top: 25px;
            font-size: 15px;
            font-weight: 700;
            color: var(--accent-blue);
        }
    </style>
</head>
<body>

    <div class="dashboard">
        <div class="gauge-wrapper">
            <svg class="gauge-svg" viewBox="0 0 200 100">
                <path class="gauge-track" d="M 10 90 A 80 80 0 0 1 190 90" />
                <path class="gauge-fill" id="gaugeProgress" d="M 10 90 A 80 80 0 0 1 190 90" />
            </svg>
            <div class="gauge-center">
                <div class="gauge-value" id="mainValue">0.00</div>
                <div class="gauge-unit" id="mainUnit">Mbps</div>
            </div>
        </div>

        <div class="metrics-grid">
            <div class="metric-card">
                <div class="metric-label">استجابة السيرفرات السعودية</div>
                <div class="metric-val color-ping" id="idlePing">--<span>ms</span></div>
            </div>
            <div class="metric-card">
                <div class="metric-label">سرعة التنزيل (Download)</div>
                <div class="metric-val color-dl" id="dlSpeed">--<span>Mbps</span></div>
            </div>
            <div class="metric-card">
                <div class="metric-label">البنق المثقل (أثناء الفحص)</div>
                <div class="metric-val color-ping" id="loadedPing">--<span>ms</span></div>
            </div>
            <div class="metric-card">
                <div class="metric-label">سرعة الرفع (Upload)</div>
                <div class="metric-val color-ul" id="ulSpeed">--<span>Mbps</span></div>
            </div>
        </div>

        <button id="startBtn">بدء تشخيص الشبكة</button>
        <div id="statusText">جاهز لإجراء القياس المرجعي</div>
    </div>

    <script src="script.js"></script>
</body>
</html>
