<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SpeedNet Pro 2026 | تشخيص الشبكة</title>
    <style>
        :root { --primary: #1a73e8; --text: #202124; --bg: #ffffff; --light: #f1f3f4; }
        body { background: var(--bg); color: var(--text); font-family: 'Segoe UI', Tahoma, sans-serif; margin: 0; display: flex; flex-direction: column; min-height: 100vh; }
        
        .main-container { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 20px; }
        
        /* شريط الإحصائيات العلوي */
        .stats-bar { 
            display: flex; width: 100%; max-width: 600px; justify-content: space-around; 
            background: var(--light); padding: 15px; border-radius: 50px; 
            margin-bottom: 30px; border: 1px solid #dadce0;
        }
        .stat-item { flex: 1; text-align: center; }
        .stat-label { font-size: 10px; color: #5f6368; font-weight: bold; margin-bottom: 4px; }
        .stat-value { font-size: 16px; font-weight: bold; color: var(--primary); }

        /* العداد الدائري المتطور */
        .gauge-container { position: relative; width: 300px; height: 300px; margin-bottom: 20px; }
        .gauge-svg { transform: rotate(-90deg); width: 100%; height: 100%; }
        .gauge-bg { fill: none; stroke: #eef0f2; stroke-width: 12; }
        .gauge-progress { 
            fill: none; stroke: var(--primary); stroke-width: 12; 
            stroke-dasharray: 754; stroke-dashoffset: 754; 
            transition: stroke-dashoffset 0.5s cubic-bezier(0.1, 0.7, 1.0, 0.1);
            stroke-linecap: round;
        }
        .gauge-text { 
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); 
            text-align: center; 
        }
        .live-val { font-size: 54px; font-weight: 200; letter-spacing: -2px; }
        .live-unit { font-size: 14px; color: #5f6368; font-weight: bold; }

        /* الأزرار */
        .controls { display: flex; gap: 15px; margin-top: 20px; }
        .btn { 
            padding: 12px 30px; border-radius: 25px; border: 1px solid var(--primary);
            font-size: 15px; font-weight: bold; cursor: pointer; transition: 0.3s;
        }
        .btn-primary { background: var(--primary); color: #fff; }
        .btn-outline { background: transparent; color: var(--primary); }
        .btn:hover { opacity: 0.8; transform: translateY(-2px); }
        .btn:disabled { border-color: #ccc; color: #ccc; cursor: not-allowed; }

        .status-msg { margin-top: 20px; font-size: 13px; color: #5f6368; }
        footer { padding: 20px; text-align: center; font-size: 12px; color: #9aa0a6; border-top: 1px solid #f1f3f4; }
    </style>
</head>
<body>

    <div class="main-container">
        <div class="stats-bar">
            <div class="stat-item"><div class="stat-label">البنق</div><div id="valUnloaded" class="stat-value">--</div></div>
            <div class="stat-item"><div class="stat-label">المثقل</div><div id="valLoaded" class="stat-value">--</div></div>
            <div class="stat-item"><div class="stat-label">التنزيل</div><div id="valDownload" class="stat-value">--</div></div>
            <div class="stat-item"><div class="stat-label">الرفع</div><div id="valUpload" class="stat-value">--</div></div>
        </div>

        <div class="gauge-container">
            <svg class="gauge-svg" viewBox="0 0 260 260">
                <circle class="gauge-bg" cx="130" cy="130" r="120"></circle>
                <circle id="gaugeProgress" class="gauge-progress" cx="130" cy="130" r="120"></circle>
            </svg>
            <div class="gauge-text">
                <div id="mainValue" class="live-val">0</div>
                <div id="mainUnit" class="live-unit">MBPS</div>
            </div>
        </div>

        <div class="controls">
            <button id="startBtn" class="btn btn-primary">بدء الفحص</button>
            <button id="resetBtn" class="btn btn-outline">إعادة فحص</button>
        </div>
        <div id="statusText" class="status-msg">نظام القياس جاهز - إصدار 2026</div>
    </div>

    <footer>حقوق التطوير والشبكات © 2026</footer>

    <script src="script.js"></script>
</body>
</html>
