<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة قياس جودة الشبكات | مشروع تخرج</title>
    <style>
        /* --- تصميم النيومورفيزم (Neumorphism) مع تخطيط احترافي --- */
        :root {
            --bg-color: #e0e5ec;
            --text-main: #2d3436;
            --text-muted: #636e72;
            --accent-blue: #0984e3;
            --accent-green: #00b894;
            --accent-orange: #e17055;
            
            --shadow-out: 9px 9px 16px rgba(163, 177, 198, 0.6), -9px -9px 16px rgba(255, 255, 255, 0.5);
            --shadow-in: inset 6px 6px 10px rgba(163, 177, 198, 0.6), inset -6px -6px 10px rgba(255, 255, 255, 0.5);
        }

        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .dashboard {
            background-color: var(--bg-color);
            border-radius: 30px;
            box-shadow: var(--shadow-out);
            width: 100%;
            max-width: 900px; /* تم التوسيع لاحتواء التصميم الجديد */
            padding: 40px;
            text-align: center;
        }

        /* --- التخطيط الشبكي (العداد في المنتصف والبطاقات حوله) --- */
        .dashboard-grid {
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            grid-template-rows: auto auto;
            gap: 25px;
            align-items: center;
            margin-bottom: 35px;
        }

        /* أماكن العناصر في الشبكة */
        .card-ping { grid-column: 1; grid-row: 1; }
        .card-loaded { grid-column: 1; grid-row: 2; }
        .gauge-wrapper { grid-column: 2; grid-row: 1 / span 2; margin: 0 20px; }
        .card-dl { grid-column: 3; grid-row: 1; }
        .card-ul { grid-column: 3; grid-row: 2; }

        /* --- العداد الدائري الكامل --- */
        .gauge-wrapper {
            position: relative;
            width: 260px;
            height: 260px;
        }

        .gauge-svg {
            width: 100%;
            height: 100%;
            transform: rotate(-90deg); /* ليبدأ من الأعلى */
        }

        .gauge-track {
            fill: none;
            stroke: #d1d9e6;
            stroke-width: 16;
        }

        .gauge-fill {
            fill: none;
            stroke: var(--accent-blue);
            stroke-width: 16;
            stroke-linecap: round;
            stroke-dasharray: 691; /* 2 * PI * 110 (Radius) */
            stroke-dashoffset: 691;
            transition: stroke-dashoffset 0.1s linear, stroke 0.3s ease;
        }

        .gauge-center {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 100%;
        }

        .gauge-value {
            font-size: 52px;
            font-weight: 900;
            color: var(--text-main);
            line-height: 1;
        }

        .gauge-unit {
            font-size: 15px;
            color: var(--text-muted);
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-top: 5px;
        }

        /* --- البطاقات المجسمة --- */
        .metric-card {
            background-color: var(--bg-color);
            border-radius: 20px;
            box-shadow: var(--shadow-out);
            padding: 25px 20px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100%;
        }

        .metric-label {
            font-size: 12px;
            color: var(--text-muted);
            font-weight: 800;
            margin-bottom: 10px;
            text-transform: uppercase;
        }

        .metric-val {
            font-size: 32px;
            font-weight: 900;
            color: var(--text-main);
        }

        .metric-val span {
            font-size: 14px;
            font-weight: 700;
            color: var(--text-muted);
            margin-right: 4px;
        }

        .color-ping { color: var(--accent-orange); }
        .color-dl { color: var(--accent-blue); }
        .color-ul { color: var(--accent-green); }

        /* --- الزر --- */
        button {
            background-color: var(--bg-color);
            color: var(--accent-blue);
            border: none;
            padding: 20px 40px;
            border-radius: 20px;
            font-size: 18px;
            font-weight: 800;
            cursor: pointer;
            box-shadow: var(--shadow-out);
            transition: all 0.2s ease;
            width: 100%;
            max-width: 400px;
            margin: 0 auto;
            display: block;
        }

        button:active { box-shadow: var(--shadow-in); color: var(--text-main); }
        button:disabled { color: var(--text-muted); cursor: not-allowed; box-shadow: var(--shadow-in); }

        #statusText {
            margin-top: 25px;
            font-size: 15px;
            font-weight: 800;
            color: var(--text-muted);
        }

        /* دعم شاشات الجوال */
        @media (max-width: 768px) {
            .dashboard-grid {
                grid-template-columns: 1fr;
                grid-template-rows: auto;
            }
            .gauge-wrapper { grid-column: 1; grid-row: 1; margin: 0 auto 30px auto; }
            .card-ping { grid-column: 1; grid-row: 2; }
            .card-loaded { grid-column: 1; grid-row: 3; }
            .card-dl { grid-column: 1; grid-row: 4; }
            .card-ul { grid-column: 1; grid-row: 5; }
        }
    </style>
</head>
<body>

    <div class="dashboard">
        
        <div class="dashboard-grid">
            <div class="metric-card card-ping">
                <div class="metric-label">الاستجابة الأساسية (Ping)</div>
                <div class="metric-val color-ping" id="idlePing">--<span>ms</span></div>
            </div>
            
            <div class="metric-card card-loaded">
                <div class="metric-label">الاستجابة المثقلة (Loaded)</div>
                <div class="metric-val color-ping" id="loadedPing">--<span>ms</span></div>
            </div>

            <div class="gauge-wrapper">
                <svg class="gauge-svg" viewBox="0 0 240 240">
                    <circle class="gauge-track" cx="120" cy="120" r="110"></circle>
                    <circle class="gauge-fill" id="gaugeProgress" cx="120" cy="120" r="110"></circle>
                </svg>
                <div class="gauge-center">
                    <div class="gauge-value" id="mainValue">0.00</div>
                    <div class="gauge-unit" id="mainUnit">Mbps</div>
                </div>
            </div>

            <div class="metric-card card-dl">
                <div class="metric-label">سرعة التنزيل (Download)</div>
                <div class="metric-val color-dl" id="dlSpeed">--<span>Mbps</span></div>
            </div>

            <div class="metric-card card-ul">
                <div class="metric-label">سرعة الرفع (Upload)</div>
                <div class="metric-val color-ul" id="ulSpeed">--<span>Mbps</span></div>
            </div>
        </div>

        <button id="startBtn">بدء تشخيص الشبكة والألعاب</button>
        <div id="statusText">الأنظمة جاهزة لإجراء القياس المرجعي</div>
    </div>

    <script>
        const ui = {
            btn: document.getElementById('startBtn'),
            status: document.getElementById('statusText'),
            mainVal: document.getElementById('mainValue'),
            gaugeLine: document.getElementById('gaugeProgress'),
            idlePing: document.getElementById('idlePing'),
            dlSpeed: document.getElementById('dlSpeed'),
            loadedPing: document.getElementById('loadedPing'),
            ulSpeed: document.getElementById('ulSpeed')
        };

        const TEST_DURATION = 10000; 
        const GAUGE_CIRCUMFERENCE = 691; 
        let gaugeMaxSpeed = 100; 

        // نقطة الحافة (Edge Node) الخاصة بكلاودفلير (الأقرب جغرافياً لتعطي بنق الألعاب الحقيقي)
        const EDGE_PING_URL = "https://cp.cloudflare.com/generate_204";

        let isTestingLoaded = false;
        let loadedPings = [];

        ui.btn.addEventListener('click', async () => {
            resetUI();
            ui.btn.disabled = true;
            ui.btn.innerText = "جاري القياس...";

            try {
                // 1. الاستجابة الأساسية (Ping الألعاب)
                ui.status.innerText = "جاري قياس استجابة خوادم الحافة (Gaming Ping)...";
                const basePing = await measureGamingPing();
                ui.idlePing.innerHTML = `${basePing}<span>ms</span>`;
                await sleep(500);

                // 2. التنزيل والبنق المثقل
                ui.status.innerText = "جاري قياس التنزيل وتأثير الاختناق (10 ثواني)...";
                ui.gaugeLine.style.stroke = "var(--accent-blue)";
                
                isTestingLoaded = true; loadedPings = [];
                startLoadedPingLoop(); 
                
                const dlSpeed = await testDownload();
                
                isTestingLoaded = false;
                ui.dlSpeed.innerHTML = `${dlSpeed}<span>Mbps</span>`;
                ui.loadedPing.innerHTML = `${calculateMedian(loadedPings)}<span>ms</span>`;
                await sleep(1000);

                // 3. الرفع (الخوارزمية الجديدة والمضمونة)
                resetGauge();
                ui.status.innerText = "جاري قياس الرفع (10 ثواني)...";
                ui.gaugeLine.style.stroke = "var(--accent-green)";
                
                const ulSpeed = await testUploadMighty();
                ui.ulSpeed.innerHTML = `${ulSpeed}<span>Mbps</span>`;

                ui.status.innerText = "اكتمل الاختبار بنجاح وتم تسجيل النتائج!";
                ui.status.style.color = "var(--accent-green)";

            } catch (err) {
                ui.status.innerText = "حدث خطأ. يرجى التأكد من اتصالك وإيقاف مانع الإعلانات.";
                ui.status.style.color = "var(--accent-orange)";
                console.error(err);
            } finally {
                ui.btn.disabled = false;
                ui.btn.innerText = "إعادة الاختبار الشامل";
                isTestingLoaded = false;
            }
        });

        const sleep = ms => new Promise(r => setTimeout(r, ms));

        function resetUI() {
            resetGauge();
            ui.status.style.color = "var(--text-muted)";
            const def = `--<span>--</span>`;
            ui.idlePing.innerHTML = def; ui.dlSpeed.innerHTML = def;
            ui.loadedPing.innerHTML = def; ui.ulSpeed.innerHTML = def;
        }

        function resetGauge() {
            gaugeMaxSpeed = 100;
            ui.mainVal.innerText = "0.00";
            ui.gaugeLine.style.strokeDashoffset = GAUGE_CIRCUMFERENCE;
        }

        function updateGauge(speed) {
            if (speed > gaugeMaxSpeed * 0.9) gaugeMaxSpeed = Math.ceil((speed + 50) / 100) * 100;
            ui.mainVal.innerText = speed.toFixed(2);
            let percent = Math.min(speed / gaugeMaxSpeed, 1);
            ui.gaugeLine.style.strokeDashoffset = GAUGE_CIRCUMFERENCE - (percent * GAUGE_CIRCUMFERENCE);
        }

        function calculateMedian(arr) {
            if (arr.length === 0) return "--";
            const sorted = [...arr].sort((a, b) => a - b);
            return sorted[Math.floor(sorted.length / 2)];
        }

        // --- محرك البنق الحقيقي (Gaming Ping) ---
        async function measureGamingPing() {
            let pings = [];
            // تسخين الاتصال (فتح قناة الـ TCP/TLS) لعدم حساب وقت التشفير
            try { await fetch(EDGE_PING_URL, { mode: 'no-cors', cache: 'no-store' }); } catch(e){}
            
            // إرسال 5 طلبات سريعة جداً وأخذ الأسرع
            for(let i=0; i<5; i++) {
                let start = performance.now();
                try {
                    await fetch(EDGE_PING_URL + '?t=' + Math.random(), { mode: 'no-cors', cache: 'no-store' });
                    pings.push(Math.round(performance.now() - start));
                } catch(e) {}
                await sleep(50);
            }
            // البنق الحقيقي للشبكة هو أسرع إشارة وصلت (Math.min)
            return pings.length > 0 ? Math.min(...pings) : "--";
        }

        async function startLoadedPingLoop() {
            while (isTestingLoaded) {
                let start = performance.now();
                try {
                    await fetch(EDGE_PING_URL + '?load=' + Math.random(), { mode: 'no-cors', cache: 'no-store' });
                    loadedPings.push(Math.round(performance.now() - start));
                } catch(e) {}
                await sleep(200);
            }
        }

        // --- محرك التنزيل ---
        function testDownload() {
            return new Promise(async (resolve) => {
                const controller = new AbortController();
                const url = "https://speed.cloudflare.com/__down?bytes=150000000"; 
                let totalBytes = 0;
                let finalSpeed = 0;
                const startTime = performance.now();

                const timeout = setTimeout(() => {
                    controller.abort();
                    resolve(finalSpeed.toFixed(2));
                }, TEST_DURATION);

                try {
                    const response = await fetch(url, { signal: controller.signal, cache: 'no-store' });
                    const reader = response.body.getReader();
                    
                    while (true) {
                        const { done, value } = await reader.read();
                        if (done) break;
                        totalBytes += value.length;
                        const duration = (performance.now() - startTime) / 1000;
                        if (duration > 0.2) {
                            finalSpeed = ((totalBytes * 8) / duration) / 1000000;
                            updateGauge(finalSpeed);
                        }
                    }
                } catch (e) {} 
                clearTimeout(timeout);
                resolve(finalSpeed.toFixed(2));
            });
        }

        // --- محرك الرفع القوي (The Mighty Upload Engine) ---
        // الخوارزمية: استخدام XMLHttpRequest لمراقبة تدفق البيانات من "كرت الشبكة" وليس من السيرفر!
        function testUploadMighty() {
            return new Promise((resolve) => {
                let finalSpeed = 0;
                const startTime = performance.now();
                let isAborted = false;
                
                const xhr = new XMLHttpRequest();
                xhr.open('POST', 'https://speed.cloudflare.com/__up', true);
                
                // تتبع حجم البيانات التي تخرج من جهازك
                xhr.upload.onprogress = (e) => {
                    if (isAborted) return;
                    const duration = (performance.now() - startTime) / 1000;
                    if (duration > 0.2 && e.loaded > 0) {
                        finalSpeed = ((e.loaded * 8) / duration) / 1000000;
                        updateGauge(finalSpeed);
                    }
                };

                // إنشاء حزمة بيانات كبيرة (30 ميجابايت) بدون تحديد نوعها لتخطي الـ CORS
                const payload = new Blob([new Uint8Array(30 * 1024 * 1024)]); 

                const timeout = setTimeout(() => {
                    isAborted = true;
                    xhr.abort(); // قطع الاتصال إجبارياً بعد 10 ثواني
                    resolve(finalSpeed.toFixed(2));
                }, TEST_DURATION);

                xhr.onload = () => { if(!isAborted) { clearTimeout(timeout); resolve(finalSpeed.toFixed(2)); }};
                xhr.onerror = () => { if(!isAborted) { clearTimeout(timeout); resolve(finalSpeed.toFixed(2)); }};

                xhr.send(payload);
            });
        }
    </script>
</body>
</html>
