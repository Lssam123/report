<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة تشخيص الشبكات | مشروع تخرج</title>
    <style>
        /* --- النمط الزجاجي المظلم (Dark Glassmorphism) --- */
        :root {
            --bg-base: #080b12;
            --glass-bg: rgba(17, 24, 39, 0.65);
            --glass-border: rgba(255, 255, 255, 0.08);
            --text-main: #f8fafc;
            --text-muted: #64748b;
            
            /* ألوان النيون المضيئة */
            --glow-cyan: #00f0ff;   /* لون التنزيل */
            --glow-purple: #b026ff; /* لون الرفع */
            --glow-orange: #ffaa00; /* لون البنق */
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-base);
            background-image: 
                radial-gradient(circle at 50% 0%, rgba(0, 240, 255, 0.08) 0%, transparent 50%),
                radial-gradient(circle at 50% 100%, rgba(176, 38, 255, 0.05) 0%, transparent 50%);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .dashboard {
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 30px;
            box-shadow: 0 30px 60px rgba(0,0,0,0.6), inset 0 1px 0 rgba(255,255,255,0.05);
            width: 100%;
            max-width: 1000px;
            padding: 50px;
        }

        /* --- التخطيط الاحترافي: العداد في المنتصف والبطاقات حوله --- */
        .grid-layout {
            display: grid;
            grid-template-columns: 1fr 320px 1fr;
            grid-template-rows: 1fr 1fr;
            gap: 25px;
            align-items: center;
            margin-bottom: 40px;
        }

        /* البطاقات اليمنى (للبنق) */
        .card-ping-idle { grid-column: 1; grid-row: 1; }
        .card-ping-loaded { grid-column: 1; grid-row: 2; }
        
        /* العداد في المنتصف */
        .center-gauge { grid-column: 2; grid-row: 1 / span 2; display: flex; justify-content: center; }
        
        /* البطاقات اليسرى (للسرعة) */
        .card-speed-dl { grid-column: 3; grid-row: 1; }
        .card-speed-ul { grid-column: 3; grid-row: 2; }

        /* --- تصميم البطاقات الزجاجية --- */
        .metric-card {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            padding: 25px 20px;
            text-align: center;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .metric-card:hover {
            transform: translateY(-5px);
            background: rgba(255, 255, 255, 0.04);
        }

        .metric-label {
            font-size: 13px;
            color: var(--text-muted);
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 12px;
        }

        .metric-val {
            font-size: 36px;
            font-weight: 900;
            display: flex;
            align-items: baseline;
            justify-content: center;
            gap: 5px;
            font-family: 'Courier New', Courier, monospace;
        }

        .metric-val span {
            font-size: 14px;
            font-weight: 600;
            color: #475569;
            font-family: 'Segoe UI', system-ui, sans-serif;
        }

        /* ألوان النيون المخصصة لكل بطاقة */
        .text-ping { color: var(--glow-orange); text-shadow: 0 0 15px rgba(255, 170, 0, 0.3); }
        .text-dl { color: var(--glow-cyan); text-shadow: 0 0 15px rgba(0, 240, 255, 0.3); }
        .text-ul { color: var(--glow-purple); text-shadow: 0 0 15px rgba(176, 38, 255, 0.3); }

        /* --- تصميم العداد (SVG) --- */
        .gauge-wrapper {
            position: relative;
            width: 280px;
            height: 280px;
        }

        .gauge-svg {
            width: 100%;
            height: 100%;
            transform: rotate(-90deg);
        }

        .gauge-track {
            fill: none;
            stroke: rgba(255, 255, 255, 0.05);
            stroke-width: 18;
            stroke-linecap: round;
        }

        .gauge-fill {
            fill: none;
            stroke: var(--glow-cyan);
            stroke-width: 18;
            stroke-linecap: round;
            stroke-dasharray: 754; /* 2 * PI * 120 */
            stroke-dashoffset: 754;
            transition: stroke-dashoffset 0.15s linear, stroke 0.3s ease;
            filter: drop-shadow(0 0 10px var(--glow-cyan));
        }

        .gauge-center-text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 100%;
            text-align: center;
        }

        .gauge-value {
            font-size: 64px;
            font-weight: 900;
            color: #fff;
            line-height: 1;
            letter-spacing: -2px;
        }

        .gauge-unit {
            font-size: 16px;
            color: var(--text-muted);
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-top: 5px;
        }

        /* --- الزر الزجاجي المضيء --- */
        button {
            background: rgba(0, 240, 255, 0.1);
            color: var(--glow-cyan);
            border: 1px solid var(--glow-cyan);
            padding: 20px 40px;
            border-radius: 16px;
            font-size: 18px;
            font-weight: 800;
            cursor: pointer;
            width: 100%;
            max-width: 400px;
            margin: 0 auto;
            display: block;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: 0 0 20px rgba(0, 240, 255, 0.1);
        }

        button:hover {
            background: var(--glow-cyan);
            color: #000;
            box-shadow: 0 0 30px rgba(0, 240, 255, 0.4);
        }

        button:disabled {
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-muted);
            border-color: var(--glass-border);
            cursor: not-allowed;
            box-shadow: none;
        }

        #statusText {
            margin-top: 25px;
            font-size: 14px;
            font-weight: 600;
            color: var(--text-muted);
            text-align: center;
            letter-spacing: 0.5px;
        }

        /* دعم شاشات الجوال المريحة */
        @media (max-width: 900px) {
            .grid-layout {
                grid-template-columns: 1fr;
                grid-template-rows: auto;
            }
            .center-gauge { grid-column: 1; grid-row: 1; margin-bottom: 20px; }
            .card-ping-idle { grid-column: 1; grid-row: 2; }
            .card-ping-loaded { grid-column: 1; grid-row: 3; }
            .card-speed-dl { grid-column: 1; grid-row: 4; }
            .card-speed-ul { grid-column: 1; grid-row: 5; }
        }
    </style>
</head>
<body>

    <div class="dashboard">
        
        <div class="grid-layout">
            <div class="metric-card card-ping-idle">
                <div class="metric-label">استجابة الألعاب (Ping)</div>
                <div class="metric-val text-ping" id="idlePing">--<span>ms</span></div>
            </div>
            
            <div class="metric-card card-ping-loaded">
                <div class="metric-label">البنق المثقل (Loaded)</div>
                <div class="metric-val text-ping" id="loadedPing">--<span>ms</span></div>
            </div>

            <div class="center-gauge">
                <div class="gauge-wrapper">
                    <svg class="gauge-svg" viewBox="0 0 260 260">
                        <circle class="gauge-track" cx="130" cy="130" r="120"></circle>
                        <circle class="gauge-fill" id="gaugeProgress" cx="130" cy="130" r="120"></circle>
                    </svg>
                    <div class="gauge-center-text">
                        <div class="gauge-value" id="mainValue">0.00</div>
                        <div class="gauge-unit">Mbps</div>
                    </div>
                </div>
            </div>

            <div class="metric-card card-speed-dl">
                <div class="metric-label">سرعة التنزيل (Download)</div>
                <div class="metric-val text-dl" id="dlSpeed">--<span>Mbps</span></div>
            </div>

            <div class="metric-card card-speed-ul">
                <div class="metric-label">سرعة الرفع (Upload)</div>
                <div class="metric-val text-ul" id="ulSpeed">--<span>Mbps</span></div>
            </div>
        </div>

        <button id="startBtn">بدء تشخيص الشبكة</button>
        <div id="statusText">جاهز لإجراء القياس المرجعي</div>

    </div>

    <script src="script.js"></script>
</body>
</html>
