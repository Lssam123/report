<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SpeedNet Pro X | 2026</title>
    <style>
        :root { 
            --bg: #000000;
            --surface: #0a0a0a;
            --primary: #9d4edd; 
            --glow: 0 0 15px rgba(157, 78, 221, 0.5);
        }

        body { background: var(--bg); color: #e0e0e0; font-family: 'Segoe UI', sans-serif; margin: 0; display: flex; flex-direction: column; min-height: 100vh; overflow: hidden; }
        
        .stats-bar { 
            display: flex; width: 90%; max-width: 600px; justify-content: space-around; 
            background: var(--surface); padding: 15px; border-radius: 50px; 
            margin: 20px auto; border: 1px solid rgba(255,255,255,0.05);
            box-shadow: 0 5px 15px rgba(0,0,0,0.5);
        }
        .stat-item { text-align: center; }
        .stat-label { font-size: 10px; color: #888; font-weight: bold; text-transform: uppercase; }
        .stat-value { font-size: 16px; font-weight: bold; color: var(--primary); text-shadow: var(--glow); }

        .gauge-zone { display: flex; flex-direction: column; align-items: center; flex: 1; justify-content: center; }
        
        .gauge-3d-wrapper {
            position: relative; width: 340px; height: 340px;
            background: var(--surface); border-radius: 50%;
            box-shadow: 0 10px 40px rgba(0,0,0,0.8), inset 0 2px 10px rgba(255,255,255,0.02);
            display: flex; justify-content: center; align-items: center;
        }

        .gauge-numbers {
            position: absolute; width: 85%; height: 85%;
            border-radius: 50%; color: #555; font-size: 12px; font-weight: bold;
        }
        .num { position: absolute; transform: translate(-50%, -50%); }
        .num-0 { top: 85%; left: 25%; }
        .num-20 { top: 50%; left: 10%; }
        .num-40 { top: 15%; left: 25%; }
        .num-60 { top: 15%; left: 75%; }
        .num-80 { top: 50%; left: 90%; }
        .num-100 { top: 85%; left: 75%; }

        .gauge-svg { transform: rotate(-225deg); width: 280px; height: 280px; }
        .gauge-bg { fill: none; stroke: #111; stroke-width: 10; stroke-dasharray: 565; stroke-dashoffset: 0; stroke-linecap: round; }
        .gauge-progress { 
            fill: none; stroke: var(--primary); stroke-width: 10; 
            stroke-dasharray: 565; stroke-dashoffset: 565; 
            stroke-linecap: round; filter: drop-shadow(0 0 8px var(--primary));
        }

        .needle {
            position: absolute; bottom: 50%; left: 50%; width: 4px; height: 115px;
            background: linear-gradient(to bottom, var(--primary) 0%, transparent 100%);
            border-radius: 4px; transform-origin: bottom center;
            transform: rotate(-135deg); z-index: 5;
            box-shadow: 0 0 15px var(--primary);
            will-change: transform;
        }
        .needle-pivot {
            position: absolute; width: 20px; height: 20px; background: var(--surface);
            border-radius: 50%; border: 3px solid var(--primary); z-index: 6;
            box-shadow: 0 0 15px var(--primary);
        }

        .gauge-readout { position: absolute; bottom: 65px; text-align: center; }
        .live-val { font-size: 56px; font-weight: 200; color: #fff; letter-spacing: -2px; }
        .live-unit { font-size: 12px; color: #666; font-weight: bold; text-transform: uppercase; }

        .controls { display: flex; gap: 20px; margin-top: 40px; }
        .btn { 
            padding: 14px 40px; border-radius: 30px; border: none; font-weight: bold; 
            cursor: pointer; transition: 0.3s; text-transform: uppercase; letter-spacing: 1px;
        }
        .btn-primary { background: var(--primary); color: #fff; box-shadow: 0 0 20px rgba(157, 78, 221, 0.4); }
        .btn-outline { background: #111; color: var(--primary); border: 1px solid var(--primary); }
        .btn:hover { transform: translateY(-2px); opacity: 0.9; }
        .btn:disabled { opacity: 0.3; cursor: not-allowed; transform: none; }

        footer { padding: 25px; text-align: center; font-size: 11px; color: #333; border-top: 1px solid #111; background: #050505; }
    </style>
</head>
<body>

    <div class="stats-bar">
        <div class="stat-item"><div class="stat-label">البنق</div><div id="valUnloaded" class="stat-value">--</div></div>
        <div class="stat-item"><div class="stat-label">المثقل</div><div id="valLoaded" class="stat-value">--</div></div>
        <div class="stat-item"><div class="stat-label">التنزيل</div><div id="valDownload" class="stat-value">--</div></div>
        <div class="stat-item"><div class="stat-label">الرفع</div><div id="valUpload" class="stat-value">--</div></div>
    </div>

    <div class="gauge-zone">
        <div class="gauge-3d-wrapper">
            <div class="gauge-numbers">
                <span class="num num-0">0</span>
                <span class="num num-20">20</span>
                <span class="num num-40">40</span>
                <span class="num num-60">60</span>
                <span class="num num-80">80</span>
                <span class="num num-100">100</span>
            </div>
            <svg class="gauge-svg" viewBox="0 0 260 260">
                <circle class="gauge-bg" cx="130" cy="130" r="90"></circle>
                <circle id="gaugeProgress" class="gauge-progress" cx="130" cy="130" r="90"></circle>
            </svg>
            <div id="needle" class="needle"></div>
            <div class="needle-pivot"></div>
            <div class="gauge-readout">
                <div id="mainValue" class="live-val">0</div>
                <div id="mainUnit" class="live-unit">MBPS</div>
            </div>
        </div>

        <div class="controls">
            <button id="startBtn" class="btn btn-primary">ابدأ القياس</button>
            <button id="resetBtn" class="btn btn-outline">إعادة الفحص</button>
        </div>
        <div id="statusText" class="status-msg" style="margin-top:20px; font-size:12px; color:#444;">نظام التشخيص المهني جاهز | 2026</div>
    </div>

    <footer>جميع الحقوق محفوظة لمتخصصي الشبكات © 2026</footer>

    <script src="script.js"></script>
</body>
</html>
