<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Precision SpeedNet | 2026</title>
    <style>
        :root { --bg: #000; --primary: #9d4edd; --text: #fff; }
        body { background: var(--bg); color: var(--text); font-family: 'Segoe UI', sans-serif; margin: 0; display: flex; flex-direction: column; min-height: 100vh; align-items: center; }
        
        .stats-bar { 
            display: flex; width: 90%; max-width: 600px; justify-content: space-around; 
            margin: 30px 0; background: #080808; padding: 20px; border-radius: 15px;
            border: 1px solid #1a1a1a; box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .stat-item { text-align: center; }
        .stat-label { font-size: 10px; color: #555; font-weight: 800; letter-spacing: 1px; }
        .stat-value { font-size: 20px; font-weight: bold; color: var(--primary); text-shadow: 0 0 10px rgba(157, 78, 221, 0.5); }

        .gauge-wrapper { position: relative; width: 320px; height: 320px; display: flex; justify-content: center; align-items: center; }
        
        .gauge-svg { transform: rotate(-220deg); width: 100%; height: 100%; }
        .gauge-track { fill: none; stroke: #0a0a0a; stroke-width: 14; stroke-linecap: round; }
        .gauge-progress { 
            fill: none; stroke: var(--primary); stroke-width: 14; 
            stroke-dasharray: 535; stroke-dashoffset: 535; 
            stroke-linecap: round; transition: stroke-dashoffset 0.08s linear;
            filter: drop-shadow(0 0 8px var(--primary));
        }

        .needle {
            position: absolute; width: 3px; height: 115px;
            background: linear-gradient(to bottom, #c77dff, transparent);
            bottom: 50%; left: 50%;
            transform-origin: bottom center; transform: rotate(-130deg);
            box-shadow: 0 0 15px var(--primary); z-index: 5;
            will-change: transform;
        }

        .numbers-overlay { position: absolute; width: 100%; height: 100%; font-size: 12px; font-weight: 900; color: #222; }
        .num { position: absolute; transform: translate(-50%, -50%); transition: color 0.2s; }
        .num.active { color: var(--primary); text-shadow: 0 0 5px var(--primary); }
        .n0   { top: 82%; left: 24%; }
        .n20  { top: 48%; left: 12%; }
        .n40  { top: 18%; left: 28%; }
        .n60  { top: 18%; left: 72%; }
        .n80  { top: 48%; left: 88%; }
        .n100 { top: 82%; left: 76%; }

        .readout { position: absolute; text-align: center; top: 60%; }
        .readout .val { font-size: 60px; font-weight: 100; line-height: 1; letter-spacing: -2px; }
        .readout .unit { font-size: 14px; color: #444; font-weight: 900; }

        .main-btn {
            margin-top: 50px; padding: 18px 70px; border-radius: 50px;
            background: var(--primary); color: #fff; border: none;
            font-size: 18px; font-weight: bold; cursor: pointer;
            box-shadow: 0 10px 25px rgba(157, 78, 221, 0.3); transition: 0.3s;
        }
        .main-btn:hover { transform: scale(1.05); }
        .main-btn.reset { background: #000; border: 1px solid var(--primary); color: var(--primary); }
        .main-btn:disabled { opacity: 0.4; cursor: not-allowed; }

        footer { margin-top: auto; padding: 25px; font-size: 11px; color: #222; letter-spacing: 1px; }
    </style>
</head>
<body>

    <div class="stats-bar">
        <div class="stat-item"><div class="stat-label">البنق الخام</div><div id="v1" class="stat-value">--</div></div>
        <div class="stat-item"><div class="stat-label">المثقل</div><div id="v2" class="stat-value">--</div></div>
        <div class="stat-item"><div class="stat-label">التنزيل</div><div id="v3" class="stat-value">--</div></div>
        <div class="stat-item"><div class="stat-label">الرفع</div><div id="v4" class="stat-value">--</div></div>
    </div>

    <div class="gauge-wrapper">
        <div class="numbers-overlay" id="nums">
            <span class="num n0">0</span><span class="num n20">20</span><span class="num n40">40</span>
            <span class="num n60">60</span><span class="num n80">80</span><span class="num n100">100</span>
        </div>
        <svg class="gauge-svg" viewBox="0 0 240 240">
            <circle class="gauge-track" cx="120" cy="120" r="85"></circle>
            <circle id="progress" class="gauge-progress" cx="120" cy="120" r="85"></circle>
        </svg>
        <div id="needle" class="needle"></div>
        <div class="readout">
            <div id="mainValue" class="val">0</div>
            <div class="unit">MBPS</div>
        </div>
    </div>

    <button id="actionBtn" class="main-btn">بدء الفحص</button>
    <div id="status" style="margin-top:15px; font-size:12px; color:#333; font-weight:bold;">Precision Diagnostic System 2026.X</div>

    <footer>Network Systems Management Technology © 2026</footer>

    <script src="script.js"></script>
</body>
</html>
