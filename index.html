<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مقياس السرعة الذكي Pro V2</title>
    <script src="https://bernii.github.io/gauge.js/dist/gauge.min.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #10101e; color: #fff; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .container { background-color: #17172c; padding: 30px; border-radius: 20px; box-shadow: 0 10px 40px rgba(0,0,0,0.5); width: 450px; text-align: center; border: 1px solid #2a2a4a; }
        h2 { margin-top: 0; color: #fff; font-size: 24px; letter-spacing: 1px; }
        
        /* تصميم منطقة العداد */
        .gauge-container { position: relative; width: 300px; height: 180px; margin: 0 auto; }
        #speedGauge { width: 100%; height: 100%; }
        .speed-text-overlay { position: absolute; bottom: 20px; left: 0; width: 100%; text-align: center; }
        .speed-text-overlay .value { font-size: 48px; font-weight: bold; color: #00f2fe; }
        .speed-text-overlay .unit { font-size: 16px; color: #a2a8d3; display: block; margin-top: -5px; }

        /* تصميم شبكة النتائج */
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin: 20px 0; text-align: right; }
        .box { background-color: #1f1f3a; padding: 15px; border-radius: 12px; border: 1px solid #2a2a4a; transition: 0.3s; }
        .box:hover { border-color: #00f2fe; }
        .box.full { grid-column: span 2; text-align: center; background-color: #17172c; border-color: #2a2a4a; }
        
        .label { font-size: 12px; color: #a2a8d3; display: block; margin-bottom: 5px; text-transform: uppercase; letter-spacing: 1px; }
        .value { font-size: 20px; font-weight: bold; color: #fff; }
        .box.full .value { color: #4facfe; } /* لون مميز للسيرفر الأفضل */
        .unit { font-size: 12px; color: #8187b1; margin-right: 5px; }

        button { background: linear-gradient(45deg, #4facfe 0%, #00f2fe 100%); color: #10101e; border: none; padding: 15px; width: 100%; border-radius: 10px; font-size: 18px; font-weight: bold; cursor: pointer; transition: 0.3s; text-transform: uppercase; letter-spacing: 1px; box-shadow: 0 4px 15px rgba(0,242,254,0.3); }
        button:hover { box-shadow: 0 6px 20px rgba(0,242,254,0.5); transform: translateY(-2px); }
        button:disabled { background: #3a3a5a; color: #8187b1; cursor: not-allowed; box-shadow: none; transform: none; }
        
        #status { margin-top: 20px; font-size: 14px; color: #00f2fe; font-weight: bold; min-height: 1em; }
    </style>
</head>
<body>

    <div class="container">
        <h2>مقياس السرعة Pro</h2>
        
        <div class="gauge-container">
            <canvas id="speedGauge"></canvas>
            <div class="speed-text-overlay">
                <span class="value" id="mainSpeedValue">0.00</span>
                <span class="unit">Mbps</span>
            </div>
        </div>

        <div class="grid">
            <div class="box full">
                <span class="label">أفضل خادم سعودي (HTTP Ping)</span>
                <span class="value" id="bestServer">--</span>
                <span class="unit" id="bestPing">(-- ms)</span>
            </div>
            <div class="box">
                <span class="label">التحميل (Download)</span>
                <span class="value" id="downloadSpeed">--</span> <span class="unit">Mbps</span>
            </div>
            <div class="box">
                <span class="label">الرفع (Upload)</span>
                <span class="value" id="uploadSpeed">--</span> <span class="unit">Mbps</span>
            </div>
        </div>

        <button id="startBtn">بدء الفحص الشامل</button>
        <div id="status">جاهز للبدء...</div>
    </div>

    <script src="script.js"></script>
</body>
</html>
