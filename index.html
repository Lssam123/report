<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مشروع التخرج | أداة قياس الجودة</title>

    <style>
        :root {
            --primary: #00643c; 
            --text-dark: #202124;
            --text-gray: #5f6368;
            --border: #dadce0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* شريط علوي نحيف ومنسق */
        .top-bar {
            width: 100%;
            background: white;
            border-bottom: 1px solid var(--border);
            padding: 10px 20px;
            display: flex;
            align-items: center;
            justify-content: flex-start; /* الشعار يمين */
            box-sizing: border-box;
        }

        .top-bar img {
            height: 45px; /* حجم صغير ومنسق للشعار */
            margin-left: 15px;
        }

        .top-bar-text {
            font-size: 15px;
            font-weight: 600;
            color: var(--text-dark);
            display: flex;
            gap: 10px;
            border-right: 2px solid var(--primary);
            padding-right: 15px;
        }

        .year-text { color: var(--primary); }

        /* حاوية الأداة - مختصرة الطول */
        .dashboard-container {
            width: 95%;
            max-width: 750px;
            background: white;
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 25px;
            margin-top: 30px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        }

        .live-monitor {
            text-align: center;
            padding: 20px 0;
            margin-bottom: 20px;
        }

        .live-val { font-size: 70px; font-weight: 300; line-height: 1; margin: 0; }
        .live-unit { font-size: 18px; color: var(--text-gray); }

        .cards-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            margin-bottom: 25px;
        }

        .data-card {
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 15px 5px;
            text-align: center;
        }

        .card-label { font-size: 13px; font-weight: 600; color: var(--text-gray); margin-bottom: 8px; }
        .card-val { font-size: 26px; font-weight: 800; color: var(--primary); }
        .card-val span { font-size: 12px; color: var(--text-gray); }

        .btn-start {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 15px 40px;
            border-radius: 8px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            max-width: 250px;
            display: block;
            margin: 0 auto;
        }

        .btn-start:disabled { background-color: #ccc; }

        @media (max-width: 600px) {
            .cards-grid { grid-template-columns: repeat(2, 1fr); }
            .top-bar-text { font-size: 13px; }
        }
    </style>
</head>
<body>

    <div class="top-bar">
        <img src="https://upload.wikimedia.org/wikipedia/ar/thumb/2/22/TVTC_Logo.svg/512px-TVTC_Logo.svg.png" alt="TVTC">
        
        <div class="top-bar-text">
            <span>مشروع تخرج متدربي الكلية التقنية</span>
            <span class="year-text">2026م</span>
        </div>
    </div>

    <div class="dashboard-container">
        <div class="live-monitor">
            <div class="live-val" id="mainValue">0</div>
            <div class="live-unit" id="mainUnit">Mbps</div>
        </div>

        <div class="cards-grid">
            <div class="data-card" id="boxUnloaded">
                <div class="card-label">البنق العادي</div>
                <div class="card-val"><span id="valUnloaded">--</span><span>ms</span></div>
            </div>
            <div class="data-card" id="boxDownload">
                <div class="card-label">التنزيل</div>
                <div class="card-val"><span id="valDownload">--</span><span>Mb</span></div>
            </div>
            <div class="data-card" id="boxLoaded">
                <div class="card-label">البنق المثقل</div>
                <div class="card-val"><span id="valLoaded">--</span><span>ms</span></div>
            </div>
            <div class="data-card" id="boxUpload">
                <div class="card-label">الرفع</div>
                <div class="card-val"><span id="valUpload">--</span><span>Mb</span></div>
            </div>
        </div>

        <button class="btn-start" id="startBtn">بدء الاختبار</button>
        <p id="statusText" style="text-align:center; font-size:14px; color:var(--text-gray); margin-top:15px;">جاهز للفحص</p>
    </div>

    <script src="script.js"></script>
</body>
</html>
