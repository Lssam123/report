<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>مشروع التخرج | أداة قياس جودة الاتصال</title>

    <style>
        :root {
            --bg-body: #f8f9fa;
            --bg-surface: #ffffff;
            --text-dark: #202124;
            --text-gray: #5f6368;
            --border-color: #dadce0;
            --primary: #00643c; 
            --success: #1e8e3e; 
        }

        body {
            font-family: 'Segoe UI', Tahoma, sans-serif;
            background-color: var(--bg-body);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        /* تكبير الشريط العلوي وتحسينه للجوال */
        .top-bar {
            width: 100%;
            background: white;
            border-bottom: 2px solid var(--primary);
            padding: 15px 25px; /* زيادة التعبئة ليكون الشريط أكبر */
            display: flex;
            align-items: center;
            justify-content: flex-start;
            box-sizing: border-box;
            gap: 20px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }

        .top-bar img {
            height: 65px; /* زيادة حجم الشعار قليلاً */
            width: auto;
        }

        .top-bar-text {
            font-size: 18px; /* تكبير الخط */
            font-weight: 700;
            color: var(--text-dark);
            border-right: 3px solid var(--primary);
            padding-right: 15px;
            line-height: 1.4;
        }

        .year-text {
            color: var(--primary);
            margin-right: 5px;
            display: inline-block;
        }

        /* حاوية الأداة - محسنة للجوال */
        .dashboard-container {
            width: 92%; /* استغلال مساحة أكبر في الجوال */
            max-width: 800px;
            background: var(--bg-surface);
            border: 1px solid var(--border-color);
            border-radius: 15px;
            padding: 30px 20px;
            margin-top: 20px;
            margin-bottom: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.06);
            box-sizing: border-box;
        }

        .header-titles h1 {
            font-size: 24px;
            text-align: center;
            margin-bottom: 25px;
            color: var(--text-dark);
        }

        .live-monitor {
            text-align: center;
            padding: 35px 0;
            margin-bottom: 25px;
            border-radius: 12px;
            background-color: #fcfcfc;
            border: 1px solid #eee;
        }

        .live-val {
            font-size: clamp(50px, 15vw, 90px); /* حجم خط مرن يتغير حسب الشاشة */
            font-weight: 300;
            line-height: 1;
            color: var(--text-dark);
        }

        .live-unit {
            font-size: 18px;
            font-weight: 600;
            color: var(--text-gray);
        }

        /* تحسين شبكة البطاقات للجوال */
        .cards-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr); /* 2 في كل صف للجوال بشكل افتراضي */
            gap: 10px;
            margin-bottom: 30px;
        }

        /* في الشاشات الكبيرة نعود لـ 4 بطاقات */
        @media (min-width: 600px) {
            .cards-grid {
                grid-template-columns: repeat(4, 1fr);
                gap: 12px;
            }
        }

        .data-card {
            background: var(--bg-surface);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 20px 5px;
            text-align: center;
        }

        .card-label {
            font-size: 13px;
            font-weight: 600;
            color: var(--text-gray);
            margin-bottom: 10px;
        }

        .card-val {
            font-size: 28px; /* حجم مناسب للجوال والكمبيوتر */
            font-weight: 800;
            direction: ltr;
        }

        .card-val span {
            font-size: 12px;
            margin-left: 2px;
            color: var(--text-gray);
        }

        .btn-start {
            background-color: var(--primary);
            color: #ffffff;
            border: none;
            padding: 16px 40px;
            border-radius: 10px;
            font-size: 19px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            max-width: 300px;
            display: block;
            margin: 0 auto;
            -webkit-tap-highlight-color: transparent; /* تحسين اللمس للجوال */
        }

        /* تعديلات الجوال الصغير جداً */
        @media (max-width: 400px) {
            .top-bar { padding: 10px 15px; gap: 10px; }
            .top-bar img { height: 50px; }
            .top-bar-text { font-size: 14px; }
            .card-val { font-size: 24px; }
        }
    </style>
</head>
<body>

    <div class="top-bar">
        <img src="logo.png" alt="Logo">
        <div class="top-bar-text">
            مشروع تخرج متدربي الكلية التقنية <span class="year-text">2026م</span>
        </div>
    </div>

    <div class="dashboard-container">
        <div class="header-titles">
            <h1>اختبار سرعة الإنترنت</h1>
        </div>

        <div class="live-monitor">
            <div class="live-val" id="mainValue">0</div>
            <div class="live-unit" id="mainUnit">Mbps</div>
        </div>

        <div class="cards-grid">
            <div class="data-card" id="boxUnloaded">
                <div class="card-label">البنق العادي</div>
                <div class="card-val"><span id="valUnloaded">--</span><span>ms</span></div>
            </div>
            
            <div class="data-card" id="boxDownload">
                <div class="card-label">التنزيل</div>
                <div class="card-val"><span id="valDownload">--</span><span>Mbps</span></div>
            </div>

            <div class="data-card" id="boxLoaded">
                <div class="card-label">البنق المثقل</div>
                <div class="card-val"><span id="valLoaded">--</span><span>ms</span></div>
            </div>

            <div class="data-card" id="boxUpload">
                <div class="card-label">الرفع</div>
                <div class="card-val"><span id="valUpload">--</span><span>Mbps</span></div>
            </div>
        </div>

        <button class="btn-start" id="startBtn">بدء الاختبار</button>
        <div style="text-align:center; margin-top:15px; color:var(--text-gray); font-size: 14px;" id="statusText">جاهز للفحص</div>
    </div>

    <script src="script.js"></script>
</body>
</html>
