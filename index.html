<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SpeedNet Pro | تشخيص الشبكة</title>
    <style>
        :root { --primary: #1a73e8; --text: #202124; --bg: #ffffff; --light: #f1f3f4; }
        body { background: var(--bg); color: var(--text); font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        
        .main-container { width: 100%; max-width: 600px; text-align: center; padding: 20px; }
        
        /* شريط الإحصائيات العلوي */
        .stats-bar { 
            display: flex; justify-content: space-around; 
            background: var(--light); padding: 15px; border-radius: 50px; 
            margin-bottom: 50px; border: 1px solid #dadce0;
        }
        .stat-item { flex: 1; }
        .stat-label { font-size: 11px; color: #5f6368; font-weight: bold; text-transform: uppercase; margin-bottom: 4px; }
        .stat-value { font-size: 18px; font-weight: bold; color: var(--primary); }

        /* العداد المركزي */
        .gauge-zone { margin: 40px 0; position: relative; }
        .live-display { font-size: 110px; font-weight: 200; color: var(--text); letter-spacing: -4px; }
        .unit-display { font-size: 20px; color: #5f6368; font-weight: bold; margin-top: -10px; }

        .btn-action { 
            width: 200px; height: 200px; border-radius: 50%; border: 2px solid var(--primary);
            background: transparent; color: var(--primary); font-size: 18px; font-weight: bold;
            cursor: pointer; transition: all 0.3s; margin-top: 30px;
        }
        .btn-action:hover { background: var(--primary); color: #fff; }
        .btn-action:disabled { border-color: #ccc; color: #ccc; cursor: not-allowed; }

        .status-msg { margin-top: 25px; font-size: 14px; color: #5f6368; }
    </style>
</head>
<body>

    <div class="main-container">
        <div class="stats-bar">
            <div class="stat-item">
                <div class="stat-label">البنق</div>
                <div id="valUnloaded" class="stat-value">--</div>
            </div>
            <div class="stat-item">
                <div class="stat-label">المثقل</div>
                <div id="valLoaded" class="stat-value">--</div>
            </div>
            <div class="stat-item">
                <div class="stat-label">التنزيل</div>
                <div id="valDownload" class="stat-value">--</div>
            </div>
            <div class="stat-item">
                <div class="stat-label">الرفع</div>
                <div id="valUpload" class="stat-value">--</div>
            </div>
        </div>

        <div class="gauge-zone">
            <div id="mainValue" class="live-display">0.00</div>
            <div id="mainUnit" class="unit-display">Mbps</div>
        </div>

        <button id="startBtn" class="btn-action">فحص الشبكة</button>
        <div id="statusText" class="status-msg">نظام القياس جاهز</div>
    </div>

    <script src="script.js"></script>
</body>
</html>
