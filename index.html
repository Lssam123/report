<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة تشخيص الشبكات المتقدمة</title>
    <style>
        :root {
            --bg: #0b0f19;
            --surface: #151b2b;
            --border: #232e48;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --primary: #3b82f6; /* لون التنزيل */
            --secondary: #10b981; /* لون الرفع */
            --ping: #f59e0b; /* لون البنق */
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background-color: var(--bg);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .dashboard {
            background-color: var(--surface);
            border: 1px solid var(--border);
            border-radius: 24px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            width: 100%;
            max-width: 850px;
            padding: 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* --- القسم العلوي: العداد --- */
        .gauge-section {
            position: relative;
            width: 320px;
            height: 180px;
            margin-bottom: 40px;
        }

        .gauge-svg {
            width: 100%;
            height: 100%;
            overflow: visible;
        }

        .gauge-track {
            fill: none;
            stroke: #1e293b;
            stroke-width: 14;
            stroke-linecap: round;
        }

        .gauge-fill {
            fill: none;
            stroke: var(--primary);
            stroke-width: 14;
            stroke-linecap: round;
            stroke-dasharray: 408; /* محيط نصف الدائرة */
            stroke-dashoffset: 408;
            transition: stroke-dashoffset 0.15s linear, stroke 0.3s ease;
            filter: drop-shadow(0 0 8px rgba(59, 130, 246, 0.4));
        }

        .gauge-center {
            position: absolute;
            bottom: -10px;
            left: 50%;
            transform: translateX(-50%);
            text-align: center;
            width: 100%;
        }

        .gauge-value {
            font-size: 64px;
            font-weight: 800;
            line-height: 1;
            color: var(--text-main);
            letter-spacing: -2px;
        }

        .gauge-unit {
            font-size: 16px;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        /* --- القسم السفلي: البطاقات (صف أفقي) --- */
        .metrics-row {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            width: 100%;
            margin-bottom: 40px;
        }

        .metric-card {
            background-color: rgba(0, 0, 0, 0.2);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 20px 15px;
            text-align: center;
            transition: transform 0.2s;
        }

        .metric-card:hover { transform: translateY(-3px); }

        .metric-label {
            font-size: 13px;
            font-weight: 700;
            color: var(--text-muted);
            margin-bottom: 12px;
        }

        .metric-val {
            font-size: 28px;
            font-weight: 800;
            display: flex;
            align-items: baseline;
            justify-content: center;
            gap: 4px;
        }

        .metric-val span {
            font-size: 13px;
            font-weight: 600;
            color: #64748b;
        }

        .val-ping { color: var(--ping); }
        .val-dl { color: var(--primary); }
        .val-ul { color: var(--secondary); }

        /* --- الزر وحالة النظام --- */
        button {
            background: linear-gradient(135deg, var(--primary), #2563eb);
            color: #fff;
            border: none;
            padding: 18px 40px;
            border-radius: 12px;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            width: 100%;
            max-width: 400px;
            transition: opacity 0.2s;
            box-shadow: 0 10px 20px -5px rgba(59, 130, 246, 0.4);
        }

        button:hover { opacity: 0.9; }
        button:disabled { background: var(--border); color: var(--text-muted); cursor: not-allowed; box-shadow: none; }

        #statusText {
            margin-top: 20px;
            font-size: 14px;
            font-weight: 600;
            color: var(--text-muted);
        }

        /* التجاوب مع شاشات الجوال */
        @media (max-width: 768px) {
            .metrics-row { grid-template-columns: repeat(2, 1fr); }
        }
    </style>
</head>
<body>

    <div class="dashboard">
        
        <div class="gauge-section">
            <svg class="gauge-svg" viewBox="0 0 280 140">
                <path class="gauge-track" d="M 10 130 A 120 120 0 0 1 270 130" />
                <path class="gauge-fill" id="gaugeProgress" d="M 10 130 A 120 120 0 0 1 270 130" />
            </svg>
            <div class="gauge-center">
                <div class="gauge-value" id="mainValue">0.00</div>
                <div class="gauge-unit">Mbps</div>
            </div>
        </div>

        <div class="metrics-row">
            <div class="metric-card">
                <div class="metric-label">استجابة الألعاب (Ping)</div>
                <div class="metric-val val-ping" id="idlePing">--<span>ms</span></div>
            </div>
            
            <div class="metric-card">
                <div class="metric-label">التنزيل (Download)</div>
                <div class="metric-val val-dl" id="dlSpeed">--<span>Mbps</span></div>
            </div>

            <div class="metric-card">
                <div class="metric-label">البنق المثقل (Loaded)</div>
                <div class="metric-val val-ping" id="loadedPing">--<span>ms</span></div>
            </div>

            <div class="metric-card">
                <div class="metric-label">الرفع (Upload)</div>
                <div class="metric-val val-ul" id="ulSpeed">--<span>Mbps</span></div>
            </div>
        </div>

        <button id="startBtn">بدء الفحص الشامل</button>
        <div id="statusText">النظام جاهز للقياس</div>

    </div>

    <script src="script.js"></script>
</body>
</html>
