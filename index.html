<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ookla Speedtest Clone | مشروع تخرج</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        /* --- تصميم يحاكي Speedtest.net (Ookla Style) --- */
        :root {
            --bg-color: #111424; /* كحلي داكن جداً */
            --panel-bg: #181c31;
            --text-main: #ffffff;
            --text-muted: #8b92a5;
            --accent-cyan: #00e5ff;
            --accent-purple: #bd00ff;
            --track-color: #242945;
        }

        body {
            font-family: 'Montserrat', 'Segoe UI', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .dashboard {
            width: 100%;
            max-width: 800px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* --- الشبكة العلوية (البنق والسرعات) --- */
        .top-metrics {
            display: flex;
            justify-content: space-between;
            width: 100%;
            margin-bottom: 50px;
            padding: 0 20px;
        }

        .metric-group {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
        }

        .metric-group.center { align-items: center; }
        .metric-group.end { align-items: flex-end; }

        .metric-label {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* أيقونات بسيطة بجانب العناوين */
        .icon { width: 16px; height: 16px; border-radius: 50%; display: inline-block; }
        .icon-ping { background-color: #fff; }
        .icon-dl { background-color: var(--accent-cyan); }
        .icon-ul { background-color: var(--accent-purple); }

        .metric-val {
            font-size: 42px;
            font-weight: 800;
            line-height: 1;
        }

        .metric-unit {
            font-size: 14px;
            color: var(--text-muted);
            margin-top: 4px;
        }

        /* --- العداد الدائري النحيف (Sleek Gauge) --- */
        .gauge-container {
            position: relative;
            width: 320px;
            height: 320px;
            margin-bottom: 50px;
        }

        .gauge-svg {
            width: 100%;
            height: 100%;
            transform: rotate(-90deg);
        }

        .gauge-track {
            fill: none;
            stroke: var(--track-color);
            stroke-width: 6; /* نحيف وأنيق */
        }

        .gauge-fill {
            fill: none;
            stroke: var(--accent-cyan);
            stroke-width: 6;
            stroke-linecap: round;
            stroke-dasharray: 942; /* 2 * PI * 150 */
            stroke-dashoffset: 942;
            transition: stroke-dashoffset 0.15s linear, stroke 0.3s ease;
            filter: drop-shadow(0 0 8px rgba(0, 229, 255, 0.4));
        }

        .gauge-center {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
        }

        .gauge-main-val {
            font-size: 64px;
            font-weight: 800;
            letter-spacing: -2px;
        }

        /* --- الزر المركزي --- */
        .start-btn {
            background-color: transparent;
            color: var(--text-main);
            border: 2px solid var(--accent-cyan);
            padding: 15px 50px;
            border-radius: 50px;
            font-size: 20px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: inherit;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .start-btn:hover {
            background-color: var(--accent-cyan);
            color: var(--bg-color);
            box-shadow: 0 0 20px rgba(0, 229, 255, 0.4);
        }

        .start-btn:disabled {
            border-color: var(--track-color);
            color: var(--text-muted);
            cursor: not-allowed;
            background-color: transparent;
            box-shadow: none;
        }

        .status {
            margin-top: 20px;
            font-size: 14px;
            color: var(--text-muted);
        }
    </style>
</head>
<body>

    <div class="dashboard">
        
        <div class="top-metrics">
            <div class="metric-group">
                <div class="metric-label"><span class="icon icon-ping"></span> Ping</div>
                <div class="metric-val" id="idlePing">--</div>
                <div class="metric-unit">ms</div>
            </div>
            
            <div class="metric-group center">
                <div class="metric-label"><span class="icon icon-dl"></span> Download</div>
                <div class="metric-val" style="color: var(--accent-cyan);" id="dlSpeed">--</div>
                <div class="metric-unit">Mbps</div>
            </div>

            <div class="metric-group end">
                <div class="metric-label"><span class="icon icon-ul"></span> Upload</div>
                <div class="metric-val" style="color: var(--accent-purple);" id="ulSpeed">--</div>
                <div class="metric-unit">Mbps</div>
            </div>
        </div>

        <div class="gauge-container">
            <svg class="gauge-svg" viewBox="0 0 320 320">
                <circle class="gauge-track" cx="160" cy="160" r="150"></circle>
                <circle class="gauge-fill" id="gaugeProgress" cx="160" cy="160" r="150"></circle>
            </svg>
            <div class="gauge-center">
                <div class="gauge-main-val" id="mainValue">0.00</div>
            </div>
        </div>

        <button class="start-btn" id="startBtn">GO</button>
        <div class="status" id="statusText">جاهز للاتصال بخوادم القياس</div>

    </div>

    <script src="script.js"></script>
</body>
</html>
