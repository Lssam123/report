<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة قياس جودة الشبكات | مشروع تخرج</title>
    <style>
        /* --- تصميم النيومورفيزم (Neumorphism) مع تخطيط احترافي --- */
        :root {
            --bg-color: #e0e5ec;
            --text-main: #2d3436;
            --text-muted: #636e72;
            --accent-blue: #0984e3;
            --accent-green: #00b894;
            --accent-orange: #e17055;
            
            --shadow-out: 9px 9px 16px rgba(163, 177, 198, 0.6), -9px -9px 16px rgba(255, 255, 255, 0.5);
            --shadow-in: inset 6px 6px 10px rgba(163, 177, 198, 0.6), inset -6px -6px 10px rgba(255, 255, 255, 0.5);
        }

        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .dashboard {
            background-color: var(--bg-color);
            border-radius: 30px;
            box-shadow: var(--shadow-out);
            width: 100%;
            max-width: 900px; /* تم التوسيع لاحتواء التصميم الجديد */
            padding: 40px;
            text-align: center;
        }

        /* --- التخطيط الشبكي (العداد في المنتصف والبطاقات حوله) --- */
        .dashboard-grid {
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            grid-template-rows: auto auto;
            gap: 25px;
            align-items: center;
            margin-bottom: 35px;
        }

        /* أماكن العناصر في الشبكة */
        .card-ping { grid-column: 1; grid-row: 1; }
        .card-loaded { grid-column: 1; grid-row: 2; }
        .gauge-wrapper { grid-column: 2; grid-row: 1 / span 2; margin: 0 20px; }
        .card-dl { grid-column: 3; grid-row: 1; }
        .card-ul { grid-column: 3; grid-row: 2; }

        /* --- العداد الدائري الكامل --- */
        .gauge-wrapper {
            position: relative;
            width: 260px;
            height: 260px;
        }

        .gauge-svg {
            width: 100%;
            height: 100%;
            transform: rotate(-90deg); /* ليبدأ من الأعلى */
        }

        .gauge-track {
            fill: none;
            stroke: #d1d9e6;
            stroke-width: 16;
        }

        .gauge-fill {
            fill: none;
            stroke: var(--accent-blue);
            stroke-width: 16;
            stroke-linecap: round;
            stroke-dasharray: 691; /* 2 * PI * 110 (Radius) */
            stroke-dashoffset: 691;
            transition: stroke-dashoffset 0.1s linear, stroke 0.3s ease;
        }

        .gauge-center {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 100%;
        }

        .gauge-value {
            font-size: 52px;
            font-weight: 900;
            color: var(--text-main);
            line-height: 1;
        }

        .gauge-unit {
            font-size: 15px;
            color: var(--text-muted);
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-top: 5px;
        }

        /* --- البطاقات المجسمة --- */
        .metric-card {
            background-color: var(--bg-color);
            border-radius: 20px;
            box-shadow: var(--shadow-out);
            padding: 25px 20px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100%;
        }

        .metric-label {
            font-size: 12px;
            color: var(--text-muted);
            font-weight: 800;
            margin-bottom: 10px;
            text-transform: uppercase;
        }

        .metric-val {
            font-size: 32px;
            font-weight: 900;
            color: var(--text-main);
        }

        .metric-val span {
            font-size: 14px;
            font-weight: 700;
            color: var(--text-muted);
            margin-right: 4px;
        }

        .color-ping { color: var(--accent-orange); }
        .color-dl { color: var(--accent-blue); }
        .color-ul { color: var(--accent-green); }

        /* --- الزر --- */
        button {
            background-color: var(--bg-color);
            color: var(--accent-blue);
            border: none;
            padding: 20px 40px;
            border-radius: 20px;
            font-size: 18px;
            font-weight: 800;
            cursor: pointer;
            box-shadow: var(--shadow-out);
            transition: all 0.2s ease;
            width: 100%;
            max-width: 400px;
            margin: 0 auto;
            display: block;
        }

        button:active { box-shadow: var(--shadow-in); color: var(--text-main); }
        button:disabled { color: var(--text-muted); cursor: not-allowed; box-shadow: var(--shadow-in); }

        #statusText {
            margin-top: 25px;
            font-size: 15px;
            font-weight: 800;
            color: var(--text-muted);
        }

        /* دعم شاشات الجوال */
        @media (max-width: 768px) {
            .dashboard-grid {
                grid-template-columns: 1fr;
                grid-template-rows: auto;
            }
            .gauge-wrapper { grid-column: 1; grid-row: 1; margin: 0 auto 30px auto; }
            .card-ping { grid-column: 1; grid-row: 2; }
            .card-loaded { grid-column: 1; grid-row: 3; }
            .card-dl { grid-column: 1; grid-row: 4; }
            .card-ul { grid-column: 1; grid-row: 5; }
        }
    </style>
</head>
<body>

    <div class="dashboard">
        
        <div class="dashboard-grid">
            <div class="metric-card card-ping">
                <div class="metric-label">الاستجابة الأساسية (Ping)</div>
                <div class="metric-val color-ping" id="idlePing">--<span>ms</span></div>
            </div>
            
            <div class="metric-card card-loaded">
                <div class="metric-label">الاستجابة المثقلة (Loaded)</div>
                <div class="metric-val color-ping" id="loadedPing">--<span>ms</span></div>
            </div>

            <div class="gauge-wrapper">
                <svg class="gauge-svg" viewBox="0 0 240 240">
                    <circle class="gauge-track" cx="120" cy="120" r="110"></circle>
                    <circle class="gauge-fill" id="gaugeProgress" cx="120" cy="120" r="110"></circle>
                </svg>
                <div class="gauge-center">
                    <div class="gauge-value" id="mainValue">0.00</div>
                    <div class="gauge-unit" id="mainUnit">Mbps</div>
                </div>
            </div>

            <div class="metric-card card-dl">
                <div class="metric-label">سرعة التنزيل (Download)</div>
                <div class="metric-val color-dl" id="dlSpeed">--<span>Mbps</span></div>
            </div>

            <div class="metric-card card-ul">
                <div class="metric-label">سرعة الرفع (Upload)</div>
                <div class="metric-val color-ul" id="ulSpeed">--<span>Mbps</span></div>
            </div>
        </div>

        <button id="startBtn">بدء تشخيص الشبكة والألعاب</button>
        <div id="statusText">الأنظمة جاهزة لإجراء القياس المرجعي</div>
    </div>

    <script src="script.js"></script>
</body>
</html>
