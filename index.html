<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SpeedNet Pro X | 2026 Edition</title>
    <style>
        :root { 
            --bg: #000000; /* اسود فخم */
            --surface: #0a0a0a;
            --primary: #9d4edd; /* بنفسجي نيون */
            --text: #e0e0e0; 
            --shadow: rgba(157, 78, 221, 0.2);
            --glow: 0 0 20px rgba(157, 78, 221, 0.6);
        }

        body { background: var(--bg); color: var(--text); font-family: 'Segoe UI', sans-serif; margin: 0; display: flex; flex-direction: column; min-height: 100vh; overflow-x: hidden; }
        
        /* شريط الإحصائيات العلوي بتصميم ثري دي */
        .stats-bar { 
            display: flex; width: 100%; max-width: 600px; justify-content: space-around; 
            background: var(--surface); padding: 15px; border-radius: 50px; 
            margin: 30px auto; border: 1px solid rgba(255,255,255,0.05);
            box-shadow: inset 0 2px 5px rgba(0,0,0,0.5), 0 5px 15px rgba(0,0,0,0.3);
        }
        .stat-item { flex: 1; text-align: center; }
        .stat-label { font-size: 10px; color: #888; font-weight: bold; text-transform: uppercase; margin-bottom: 4px; }
        .stat-value { font-size: 16px; font-weight: bold; color: var(--primary); text-shadow: var(--glow); }

        /* حاوية العداد الثري دي */
        .gauge-zone { display: flex; flex-direction: column; justify-content: center; align-items: center; flex: 1; margin-bottom: 50px; }
        
        .gauge-3d-wrapper {
            position: relative; width: 320px; height: 320px;
            background: var(--surface); border-radius: 50%;
            border: 2px solid rgba(255,255,255,0.05);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5), inset 0 2px 10px rgba(255,255,255,0.02);
            display: flex; justify-content: center; align-items: center;
        }

        /* العداد الدائري النيون */
        .gauge-svg { transform: rotate(-90deg); width: 280px; height: 280px; }
        .gauge-bg { fill: none; stroke: #111; stroke-width: 6; }
        .gauge-glow { fill: none; stroke: var(--primary); stroke-width: 8; stroke-linecap: round; opacity: 0.1; }
        .gauge-progress { 
            fill: none; stroke: var(--primary); stroke-width: 8; 
            stroke-dasharray: 754; stroke-dashoffset: 754; 
            transition: stroke-dashoffset 0.1s linear; /* حركة سريعة للإبرة */
            stroke-linecap: round;
            filter: drop-shadow(0 0 8px var(--primary)); /* توهج الإبرة */
        }

        /* الإبرة المتحركة (Needle) */
        .needle {
            position: absolute; bottom: 50%; left: 50%; width: 4px; height: 110px;
            background: linear-gradient(to bottom, var(--primary) 0%, rgba(157, 78, 221, 0) 100%);
            border-radius: 4px; transform-origin: bottom center;
            transform: rotate(-135deg); /* نقطة البداية */
            transition: transform 0.1s linear; /* حركة الإبرة */
            box-shadow: 0 0 10px var(--primary);
            z-index: 5;
        }
        .needle-pivot {
            position: absolute; bottom: calc(50% - 10px); left: calc(50% - 10px);
            width: 20px; height: 20px; background: var(--surface);
            border-radius: 50%; border: 3px solid var(--primary);
            box-shadow: 0 0 15px var(--primary), inset 0 2px 5px rgba(0,0,0,0.5);
            z-index: 6;
        }

        /* قراءة العداد */
        .gauge-readout { position: absolute; bottom: 70px; text-align: center; z-index: 10; width: 100%; }
        .live-val { font-size: 58px; font-weight: 200; color: var(--text); letter-spacing: -3px; text-shadow: 0 2px 5px rgba(0,0,0,0.5); }
        .live-unit { font-size: 14px; color: #888; font-weight: bold; text-transform: uppercase; margin-top: -5px; }

        /* الأزرار النيون الثري دي */
        .controls { display: flex; gap: 20px; margin-top: 30px; }
        .btn { 
            padding: 15px 40px; border-radius: 30px; border: none;
            font-size: 16px; font-weight: bold; cursor: pointer; transition: all 0.2s;
            text-transform: uppercase; letter-spacing: 1px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3), inset 0 1px 3px rgba(255,255,255,0.05);
        }
        .btn-primary { background: var(--primary); color: #fff; box-shadow: 0 0 20px rgba(157, 78, 221, 0.4); }
        .btn-outline { background: var(--surface); color: var(--primary); border: 1px solid var(--primary); }
        
        .btn:hover { transform: translateY(-3px); box-shadow: 0 8px 25px rgba(0,0,0,0.4), 0 0 15px rgba(157, 78, 221, 0.3); }
        .btn:active { transform: translateY(1px); box-shadow: 0 2px 5px rgba(0,0,0,0.3); }
        .btn:disabled { background: #1a1a1a; color: #555; border-color: #222; box-shadow: none; cursor: not-allowed; }

        .status-msg { margin-top: 25px; font-size: 13px; color: #666; font-weight: 500; }
        footer { padding: 25px; text-align: center; font-size: 11px; color: #444; border-top: 1px solid rgba(255,255,255,0.02); background: var(--surface); }
    </style>
</head>
<body>

    <div class="stats-bar">
        <div class="stat-item"><div class="stat-label">البنق</div><div id="valUnloaded" class="stat-value">--</div></div>
        <div class="stat-item"><div class="stat-label">المثقل</div><div id="valLoaded" class="stat-value">--</div></div>
        <div class="stat-item"><div class="stat-label">التنزيل</div><div id="valDownload" class="stat-value">--</div></div>
        <div class="stat-item"><div class="stat-label">الرفع</div><div id="valUpload" class="stat-value">--</div></div>
    </div>

    <div class="gauge-zone">
        <div class="gauge-3d-wrapper">
            <svg class="gauge-svg" viewBox="0 0 260 260">
                <circle class="gauge-bg" cx="130" cy="130" r="120"></circle>
                <circle class="gauge-glow" cx="130" cy="130" r="120"></circle>
                <circle id="gaugeProgress" class="gauge-progress" cx="130" cy="130" r="120"></circle>
            </svg>
            <div id="needle" class="needle"></div>
            <div class="needle-pivot"></div>
            <div class="gauge-readout">
                <div id="mainValue" class="live-val">0</div>
                <div id="mainUnit" class="live-unit">MBPS</div>
            </div>
        </div>

        <div class="controls">
            <button id="startBtn" class="btn btn-primary">ابدأ القياس</button>
            <button id="resetBtn" class="btn btn-outline">إعادة الفحص</button>
        </div>
        <div id="statusText" class="status-msg">المنصة جاهزة - نظام 2026.1 X</div>
    </div>

    <footer>حقوق التطوير والشبكات المتقدمة © 2026 | جميع الحقوق محفوظة</footer>

    <script src="script.js"></script>
</body>
</html>
