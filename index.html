<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>فحص الشبكة - الإصدار الاحترافي</title>
    <style>
        /* --- النمط المظلم المضيء (Dark Neon UI) المستوحى من تصاميم Dribbble --- */
        :root {
            --bg-main: #0a0e17;
            --bg-card: #121826;
            --text-main: #ffffff;
            --text-muted: #8b9bb4;
            
            /* ألوان التدرج المضيئة */
            --neon-blue: #00f2fe;
            --neon-purple: #4facfe;
            --neon-ping: #ff0844;
            --neon-up: #00f260;
            
            --border-color: rgba(255, 255, 255, 0.05);
        }

        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background-color: var(--bg-main);
            background-image: radial-gradient(circle at 50% 0%, rgba(79, 172, 254, 0.15) 0%, transparent 50%);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .app-container {
            width: 100%;
            max-width: 800px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* --- العداد العملاق المضيء --- */
        .gauge-container {
            position: relative;
            width: 340px;
            height: 340px;
            margin-bottom: 40px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .gauge-svg {
            position: absolute;
            width: 100%;
            height: 100%;
            transform: rotate(-90deg);
        }

        /* تعريف التدرج اللوني داخل الـ SVG */
        .gauge-track {
            fill: none;
            stroke: var(--bg-card);
            stroke-width: 12;
        }

        .gauge-fill {
            fill: none;
            stroke: url(#gaugeGradient);
            stroke-width: 18;
            stroke-linecap: round;
            stroke-dasharray: 880; /* 2 * PI * 140 */
            stroke-dashoffset: 880;
            transition: stroke-dashoffset 0.15s linear;
            filter: drop-shadow(0 0 12px rgba(0, 242, 254, 0.5));
        }

        .gauge-content {
            text-align: center;
            z-index: 2;
        }

        .speed-value {
            font-size: 72px;
            font-weight: 900;
            letter-spacing: -2px;
            margin: 0;
            line-height: 1;
            text-shadow: 0 0 20px rgba(255, 255, 255, 0.3);
        }

        .speed-unit {
            font-size: 18px;
            color: var(--text-muted);
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-top: 5px;
        }

        /* --- البطاقات السفلية الأنيقة --- */
        .metrics-row {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            width: 100%;
            margin-bottom: 40px;
        }

        .metric-card {
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 24px;
            padding: 25px;
            text-align: center;
            position: relative;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        /* خط مضيء أعلى كل بطاقة */
        .metric-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 3px;
            background: linear-gradient(90deg, transparent, var(--neon-blue), transparent);
            opacity: 0.5;
        }

        .card-ping::before { background: linear-gradient(90deg, transparent, var(--neon-ping), transparent); }
        .card-ul::before { background: linear-gradient(90deg, transparent, var(--neon-up), transparent); }

        .metric-label {
            font-size: 14px;
            color: var(--text-muted);
            font-weight: 600;
            margin-bottom: 15px;
        }

        .metric-value-wrapper {
            display: flex;
            align-items: baseline;
            justify-content: center;
            gap: 5px;
        }

        .metric-val {
            font-size: 32px;
            font-weight: 800;
        }

        .metric-unit {
            font-size: 14px;
            color: var(--text-muted);
            font-weight: 500;
        }

        .val-ping { color: #ff4757; }
        .val-dl { color: var(--neon-blue); }
        .val-ul { color: var(--neon-up); }

        /* --- الزر المضيء --- */
        .btn-start {
            background: linear-gradient(135deg, #00f2fe 0%, #4facfe 100%);
            color: #000;
            border: none;
            padding: 20px 50px;
            border-radius: 50px; /* زر بيضاوي حديث */
            font-size: 20px;
            font-weight: 800;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 10px 25px rgba(0, 242, 254, 0.4);
            letter-spacing: 1px;
            width: 100%;
            max-width: 350px;
        }

        .btn-start:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 35px rgba(0, 242, 254, 0.6);
        }

        .btn-start:disabled {
            background: var(--bg-card);
            color: var(--text-muted);
            border: 1px solid var(--border-color);
            cursor: not-allowed;
            box-shadow: none;
            transform: none;
        }

        .status-text {
            margin-top: 20px;
            font-size: 15px;
            color: var(--text-muted);
            font-weight: 500;
            min-height: 20px;
        }

        /* التجاوب مع الجوال */
        @media (max-width: 768px) {
            .metrics-row {
                grid-template-columns: 1fr;
            }
            .gauge-container {
                width: 280px;
                height: 280px;
            }
        }
    </style>
</head>
<body>

    <div class="app-container">
        
        <div class="gauge-container">
            <svg class="gauge-svg" viewBox="0 0 300 300">
                <defs>
                    <linearGradient id="gaugeGradient" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" stop-color="#00f2fe" />
                        <stop offset="100%" stop-color="#4facfe" />
                    </linearGradient>
                    <linearGradient id="uploadGradient" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" stop-color="#00f260" />
                        <stop offset="100%" stop-color="#0575e6" />
                    </linearGradient>
                </defs>
                <circle class="gauge-track" cx="150" cy="150" r="140"></circle>
                <circle class="gauge-fill" id="gaugeProgress" cx="150" cy="150" r="140"></circle>
            </svg>
            
            <div class="gauge-content">
                <div class="speed-value" id="mainValue">0.00</div>
                <div class="speed-unit">Mbps</div>
            </div>
        </div>

        <div class="metrics-row">
            <div class="metric-card card-ping">
                <div class="metric-label">استجابة الألعاب (Ping)</div>
                <div class="metric-value-wrapper">
                    <span class="metric-val val-ping" id="idlePing">--</span>
                    <span class="metric-unit">ms</span>
                </div>
            </div>
            
            <div class="metric-card card-dl">
                <div class="metric-label">التنزيل (Download)</div>
                <div class="metric-value-wrapper">
                    <span class="metric-val val-dl" id="dlSpeed">--</span>
                    <span class="metric-unit">Mbps</span>
                </div>
            </div>

            <div class="metric-card card-ul">
                <div class="metric-label">الرفع (Upload)</div>
                <div class="metric-value-wrapper">
                    <span class="metric-val val-ul" id="ulSpeed">--</span>
                    <span class="metric-unit">Mbps</span>
                </div>
            </div>
        </div>

        <button class="btn-start" id="startBtn">بدء الفحص</button>
        <div class="status-text" id="statusText">الأنظمة جاهزة</div>

    </div>

    <script src="script.js"></script>
</body>
</html>
