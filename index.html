<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>مشروع التخرج | أداة قياس جودة الاتصال</title>

    <style>
        :root {
            --bg-body: #f0f2f5;
            --bg-surface: #ffffff;
            --text-dark: #202124;
            --text-gray: #5f6368;
            --border-color: #dadce0;
            --primary: #00643c; 
        }

        /* منع التمرير في الصفحة بالكامل */
        html, body {
            height: 100%;
            overflow: hidden;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, sans-serif;
            background-color: var(--bg-body);
        }

        body {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* 1. الشريط العلوي - نحيف ومرتب */
        .top-bar {
            width: 100%;
            max-width: 900px;
            background: white;
            border-bottom: 2px solid var(--primary);
            padding: 8px 20px;
            display: flex;
            align-items: center;
            justify-content: flex-start;
            box-sizing: border-box;
            gap: 15px;
        }

        .top-bar img {
            height: 45px; /* تصغير الارتفاع قليلاً */
            width: auto;
        }

        .top-bar-text {
            font-size: 15px;
            font-weight: 700;
            color: var(--text-dark);
            border-right: 2px solid var(--primary);
            padding-right: 12px;
            line-height: 1.2;
        }

        /* 2. مربع الاختبار - ملتصق ومختصر الطول */
        .dashboard-container {
            width: 100%;
            max-width: 900px;
            background: var(--bg-surface);
            border: 1px solid var(--border-color);
            border-top: none;
            padding: 15px 20px; /* تقليل المسافات الداخلية */
            box-shadow: 0 5px 15px rgba(0,0,0,0.05);
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .header-titles h1 {
            font-size: 18px; /* تصغير العنوان */
            text-align: center;
            margin: 5px 0;
            color: var(--text-dark);
        }

        /* شاشة عرض السرعة - مضغوطة */
        .live-monitor {
            text-align: center;
            padding: 15px 0;
            border-radius: 10px;
            background-color: #fcfcfc;
            border: 1px solid #eee;
        }

        .live-val {
            font-size: clamp(50px, 10vw, 75px); /* تصغير الرقم الكبير */
            font-weight: 300;
            line-height: 1;
            color: var(--text-dark);
            margin: 0;
        }

        .live-unit {
            font-size: 16px;
            font-weight: 600;
            color: var(--text-gray);
        }

        /* شبكة البطاقات - أصغر حجماً */
        .cards-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
        }

        .data-card {
            background: var(--bg-surface);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 10px 2px;
            text-align: center;
        }

        .card-label {
            font-size: 12px;
            font-weight: 600;
            color: var(--text-gray);
            margin-bottom: 5px;
        }

        .card-val {
            font-size: 22px; /* تصغير الأرقام الجانبية */
            font-weight: 800;
            direction: ltr;
        }

        .card-val span {
            font-size: 11px;
            color: var(--text-gray);
        }

        /* الزر والحالة */
        .footer-actions {
            text-align: center;
            margin-top: 5px;
        }

        .btn-start {
            background-color: var(--primary);
            color: #ffffff;
            border: none;
            padding: 12px 40px;
            border-radius: 8px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            max-width: 280px;
        }

        #statusText {
            font-size: 13px;
            color: var(--text-gray);
            margin-top: 8px;
        }

        /* الجوال */
        @media (max-width: 600px) {
            .cards-grid { grid-template-columns: repeat(2, 1fr); }
            .top-bar, .dashboard-container { max-width: 100%; border-left: none; border-right: none; }
            .top-bar-text { font-size: 13px; }
        }
    </style>
</head>
<body>

    <div class="top-bar">
        <img src="logo.png" alt="Logo">
        <div class="top-bar-text">
            مشروع تخرج متدربي الكلية التقنية <span style="color:var(--primary)">2026م</span>
        </div>
    </div>

    <div class="dashboard-container">
        <div class="header-titles">
            <h1>اختبار سرعة الإنترنت</h1>
        </div>

        <div class="live-monitor">
            <div class="live-val" id="mainValue">0</div>
            <div class="live-unit" id="mainUnit">Mbps</div>
        </div>

        <div class="cards-grid">
            <div class="data-card" id="boxUnloaded">
                <div class="card-label">البنق العادي</div>
                <div class="card-val"><span id="valUnloaded">--</span><span>ms</span></div>
            </div>
            
            <div class="data-card" id="boxDownload">
                <div class="card-label">التنزيل</div>
                <div class="card-val"><span id="valDownload">--</span><span>Mb</span></div>
            </div>

            <div class="data-card" id="boxLoaded">
                <div class="card-label">البنق المثقل</div>
                <div class="card-val"><span id="valLoaded">--</span><span>ms</span></div>
            </div>

            <div class="data-card" id="boxUpload">
                <div class="card-label">الرفع</div>
                <div class="card-val"><span id="valUpload">--</span><span>Mb</span></div>
            </div>
        </div>

        <div class="footer-actions">
            <button class="btn-start" id="startBtn">بدء الاختبار</button>
            <div id="statusText">جاهز للفحص</div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
