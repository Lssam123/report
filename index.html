<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SpeedNet Elite X | 2026</title>
    <style>
        :root { 
            --bg: #000000;
            --surface: #080808;
            --primary: #9d4edd; 
            --accent: #c77dff;
            --glow: 0 0 20px rgba(157, 78, 221, 0.4);
        }

        body { background: var(--bg); color: #e0e0e0; font-family: 'Segoe UI', system-ui, sans-serif; margin: 0; display: flex; flex-direction: column; min-height: 100vh; overflow: hidden; }
        
        .stats-bar { 
            display: flex; width: 95%; max-width: 650px; justify-content: space-around; 
            background: var(--surface); padding: 18px; border-radius: 50px; 
            margin: 25px auto; border: 1px solid rgba(157, 78, 221, 0.1);
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
        }
        .stat-item { text-align: center; flex: 1; }
        .stat-label { font-size: 10px; color: #666; font-weight: 800; letter-spacing: 1px; margin-bottom: 5px; }
        .stat-value { font-size: 18px; font-weight: 700; color: var(--primary); text-shadow: var(--glow); }

        .gauge-zone { display: flex; flex-direction: column; align-items: center; flex: 1; justify-content: center; padding-bottom: 40px; }
        
        .gauge-3d-wrapper {
            position: relative; width: 350px; height: 350px;
            background: radial-gradient(circle, #0f0f0f 0%, #000 70%); border-radius: 50%;
            box-shadow: 0 20px 50px rgba(0,0,0,0.9), inset 0 0 20px rgba(157, 78, 221, 0.05);
            display: flex; justify-content: center; align-items: center; border: 1px solid #111;
        }

        .gauge-numbers { position: absolute; width: 88%; height: 88%; border-radius: 50%; color: #333; font-size: 13px; font-weight: 900; }
        .num { position: absolute; transform: translate(-50%, -50%); transition: color 0.3s; }
        .num.active { color: var(--primary); text-shadow: var(--glow); }
        .num-0 { top: 85%; left: 25%; } .num-20 { top: 50%; left: 10%; } .num-40 { top: 15%; left: 25%; }
        .num-60 { top: 15%; left: 75%; } .num-80 { top: 50%; left: 90%; } .num-100 { top: 85%; left: 75%; }

        .gauge-svg { transform: rotate(-225deg); width: 300px; height: 300px; }
        .gauge-bg { fill: none; stroke: #0a0a0a; stroke-width: 12; stroke-linecap: round; }
        .gauge-progress { 
            fill: none; stroke: var(--primary); stroke-width: 12; 
            stroke-dasharray: 565; stroke-dashoffset: 565; 
            stroke-linecap: round; filter: drop-shadow(0 0 10px var(--primary));
            transition: stroke-dashoffset 0.1s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .needle {
            position: absolute; bottom: 50%; left: 50%; width: 4px; height: 120px;
            background: linear-gradient(to bottom, var(--accent) 0%, transparent 100%);
            border-radius: 4px; transform-origin: bottom center;
            transform: rotate(-135deg); z-index: 5;
            box-shadow: 0 0 20px var(--primary); will-change: transform;
        }
        .needle-pivot {
            position: absolute; width: 24px; height: 24px; background: #000;
            border-radius: 50%; border: 3px solid var(--primary); z-index: 6;
            box-shadow: 0 0 20px var(--primary), inset 0 0 10px var(--primary);
        }

        .gauge-readout { position: absolute; bottom: 70px; text-align: center; }
        .live-val { font-size: 65px; font-weight: 100; color: #fff; letter-spacing: -3px; }
        .live-unit { font-size: 14px; color: #444; font-weight: 800; margin-top: -10px; }

        .action-btn { 
            margin-top: 50px; padding: 18px 60px; border-radius: 40px; border: none;
            background: linear-gradient(135deg, var(--primary), #5a189a);
            color: #fff; font-size: 18px; font-weight: 700; cursor: pointer;
            box-shadow: 0 10px 30px rgba(157, 78, 221, 0.3); transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            text-transform: uppercase; letter-spacing: 1px;
        }
        .action-btn:hover { transform: scale(1.05) translateY(-3px); box-shadow: 0 15px 40px rgba(157, 78, 221, 0.5); }
        .action-btn:active { transform: scale(0.95); }
        .action-btn.reset-mode { background: #111; border: 1px solid var(--primary); color: var(--primary); }
        .action-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

        footer { padding: 25px; text-align: center; font-size: 11px; color: #333; letter-spacing: 1px; }
    </style>
</head>
<body>

    <div class="stats-bar">
        <div class="stat-item"><div class="stat-label">البنق</div><div id="valUnloaded" class="stat-value">--</div></div>
        <div class="stat-item"><div class="stat-label">المثقل</div><div id="valLoaded" class="stat-value">--</div></div>
        <div class="stat-item"><div class="stat-label">التنزيل</div><div id="valDownload" class="stat-value">--</div></div>
        <div class="stat-item"><div class="stat-label">الرفع</div><div id="valUpload" class="stat-value">--</div></div>
    </div>

    <div class="gauge-zone">
        <div class="gauge-3d-wrapper">
            <div class="gauge-numbers" id="gaugeNums">
                <span class="num num-0">0</span><span class="num num-20">20</span><span class="num num-40">40</span>
                <span class="num num-60">60</span><span class="num num-80">80</span><span class="num num-100">100</span>
            </div>
            <svg class="gauge-svg" viewBox="0 0 260 260">
                <circle class="gauge-bg" cx="130" cy="130" r="90"></circle>
                <circle id="gaugeProgress" class="gauge-progress" cx="130" cy="130" r="90"></circle>
            </svg>
            <div id="needle" class="needle"></div>
            <div class="needle-pivot"></div>
            <div class="gauge-readout">
                <div id="mainValue" class="live-val">0</div>
                <div id="mainUnit" class="live-unit">MBPS</div>
            </div>
        </div>

        <button id="mainBtn" class="action-btn">بدء الفحص</button>
        <div id="statusText" class="status-msg" style="margin-top:25px; font-size:12px; color:#444; font-weight:600;">نظام 2026.X جاهز للعمل</div>
    </div>

    <footer>نظام تشخيص الشبكة الاحترافي © 2026</footer>

    <script src="script.js"></script>
</body>
</html>
