<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة فحص جودة الشبكة</title>
    <style>
        /* --- تصميم شبكي نظيف جداً ومرتب (Clean Dashboard) --- */
        :root {
            --bg-page: #0d1117;
            --bg-card: #161b22;
            --border: #30363d;
            --text-main: #c9d1d9;
            --text-muted: #8b949e;
            
            --color-dl: #58a6ff;   /* أزرق للتحميل */
            --color-ul: #3fb950;   /* أخضر للرفع */
            --color-ping: #f0883e; /* برتقالي للبنق */
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-page);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 800px;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 40px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
        }

        /* --- شبكة النتائج (4 مربعات متساوية ومرتبة) --- */
        .metrics-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
            margin-bottom: 40px;
        }

        .metric-box {
            background: var(--bg-page);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 20px 10px;
            text-align: center;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .metric-title {
            font-size: 13px;
            font-weight: 600;
            color: var(--text-muted);
            margin-bottom: 10px;
        }

        .metric-value {
            font-size: 24px;
            font-weight: bold;
            display: flex;
            justify-content: center;
            align-items: baseline;
            gap: 4px;
        }

        .metric-unit {
            font-size: 12px;
            font-weight: normal;
            color: var(--text-muted);
        }

        .val-idle { color: var(--color-ping); }
        .val-dl { color: var(--color-dl); }
        .val-loaded { color: var(--color-ping); }
        .val-ul { color: var(--color-ul); }

        /* --- العداد الدائري المركزي --- */
        .gauge-section {
            display: flex;
            justify-content: center;
            margin-bottom: 40px;
        }

        .gauge-wrapper {
            position: relative;
            width: 280px;
            height: 140px; /* نصف دائرة */
        }

        .gauge-svg {
            width: 100%;
            height: 100%;
            overflow: visible;
        }

        .gauge-track {
            fill: none;
            stroke: var(--border);
            stroke-width: 12;
            stroke-linecap: round;
        }

        .gauge-fill {
            fill: none;
            stroke: var(--color-dl);
            stroke-width: 12;
            stroke-linecap: round;
            stroke-dasharray: 408; /* محيط نصف الدائرة */
            stroke-dashoffset: 408;
            transition: stroke-dashoffset 0.1s linear, stroke 0.3s ease;
        }

        .gauge-center {
            position: absolute;
            bottom: -15px;
            left: 50%;
            transform: translateX(-50%);
            text-align: center;
            width: 100%;
        }

        .gauge-main-val {
            font-size: 48px;
            font-weight: bold;
            color: #ffffff;
            line-height: 1;
        }

        .gauge-main-unit {
            font-size: 14px;
            color: var(--text-muted);
            margin-top: 5px;
        }

        /* --- الزر وحالة الفحص --- */
        .control-section {
            text-align: center;
        }

        .start-btn {
            background-color: var(--color-dl);
            color: #0d1117;
            border: none;
            padding: 15px 40px;
            border-radius: 8px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            max-width: 300px;
            transition: opacity 0.2s;
        }

        .start-btn:hover { opacity: 0.8; }
        .start-btn:disabled { background-color: var(--border); color: var(--text-muted); cursor: not-allowed; }

        .status-text {
            margin-top: 15px;
            font-size: 14px;
            color: var(--text-muted);
        }

        /* توافق الجوال */
        @media (max-width: 768px) {
            .metrics-grid { grid-template-columns: repeat(2, 1fr); }
        }
    </style>
</head>
<body>

    <div class="container">
        
        <div class="metrics-grid">
            <div class="metric-box">
                <div class="metric-title">البنق غير المثقل</div>
                <div class="metric-value val-idle" id="unloadedPing">-- <span class="metric-unit">ms</span></div>
            </div>
            
            <div class="metric-box">
                <div class="metric-title">التحميل</div>
                <div class="metric-value val-dl" id="dlSpeed">-- <span class="metric-unit">Mbps</span></div>
            </div>

            <div class="metric-box">
                <div class="metric-title">البنق المثقل</div>
                <div class="metric-value val-loaded" id="loadedPing">-- <span class="metric-unit">ms</span></div>
            </div>

            <div class="metric-box">
                <div class="metric-title">الرفع</div>
                <div class="metric-value val-ul" id="ulSpeed">-- <span class="metric-unit">Mbps</span></div>
            </div>
        </div>

        <div class="gauge-section">
            <div class="gauge-wrapper">
                <svg class="gauge-svg" viewBox="0 0 280 140">
                    <path class="gauge-track" d="M 10 130 A 120 120 0 0 1 270 130" />
                    <path class="gauge-fill" id="gaugeProgress" d="M 10 130 A 120 120 0 0 1 270 130" />
                </svg>
                <div class="gauge-center">
                    <div class="gauge-main-val" id="mainValue">0.00</div>
                    <div class="gauge-main-unit">Mbps</div>
                </div>
            </div>
        </div>

        <div class="control-section">
            <button class="start-btn" id="startBtn">بدء الفحص</button>
            <div class="status-text" id="statusText">جاهز للبدء</div>
        </div>

    </div>

    <script src="script.js"></script>
</body>
</html>
